<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soru Defteri">
<meta name="theme-color" content="#0e1014">
<title>Soru Defteri</title>
<style>
:root{
  --bg:#0e1014; --kart:#171a21; --kart2:#20242e; --cizgi:#272b35;
  --yazi:#f1f3f7; --soluk:#8b93a1; --ana:#5b8cff; --yesil:#2fb378; --kirmizi:#ef5a5a;
  --tyt:linear-gradient(135deg,#3366ff 0%,#4fb8ff 100%);
  --ayt:linear-gradient(135deg,#7c4dff 0%,#e9609b 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* Üst çubuk */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(14,16,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.golge{border-bottom-color:var(--cizgi)}
header h1{font-size:17px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.buyuk h1{font-size:32px;font-weight:800;letter-spacing:-.025em;padding-top:6px}
#geri{background:none;border:0;color:var(--ana);font-size:36px;line-height:1;padding:0 10px 4px 0;width:auto;margin:0}
main{padding:8px 16px 16px;max-width:720px;margin:0 auto}
h2{font-size:13px;color:var(--soluk);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:28px 4px 10px}

/* Ana sayfa */
.selam{color:var(--soluk);margin:0 0 16px 2px;font-size:15px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;border-radius:22px;background:var(--kart);border:1px solid var(--cizgi);cursor:pointer}
.hero-sayi{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hero-yazi{color:var(--soluk);margin-top:6px;font-size:15px}
.hero-ipucu{color:#5f6673;font-size:12.5px;margin-top:4px}
.hero-btn{background:var(--ana);color:#fff;font-weight:700;padding:11px 18px;border-radius:999px;white-space:nowrap}
.sinavlar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sinav{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#fff;cursor:pointer;min-height:168px;display:flex;flex-direction:column}
.sinav.tyt{background:var(--tyt)} .sinav.ayt{background:var(--ayt)}
.sinav::before,.sinav::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.sinav::before{width:130px;height:130px;right:-40px;bottom:-45px}
.sinav::after{width:60px;height:60px;right:40px;top:-25px;background:rgba(255,255,255,.08)}
.sinav-ad{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sinav-alt{opacity:.88;font-size:14px;font-weight:500}
.sinav-bilgi{position:relative;z-index:1;margin-top:auto;display:flex;flex-direction:column;gap:1px;font-size:13.5px}
.sinav-bilgi b{font-size:15px}
.serit{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.serit::-webkit-scrollbar{display:none}
.serit .kucuk{width:100px;height:100px;flex:none;border-radius:14px;overflow:hidden;background:var(--kart);cursor:pointer}
.serit .kucuk img,.serit .kucuk .resim-hata{width:100%;height:100%;object-fit:cover;display:block;background:#fff;min-height:0}

/* Görsel yükleme durumları */
img.yukleniyor{background:linear-gradient(100deg,var(--kart) 30%,var(--kart2) 50%,var(--kart) 70%) !important;background-size:300% 100% !important;animation:parilti 1.2s linear infinite}
img.yukleniyor.buyuk-resim,img.yukleniyor.kart-resim{aspect-ratio:4/3;height:auto}
@keyframes parilti{from{background-position:100% 0}to{background-position:-50% 0}}
.resim-hata{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--kart2) !important;color:var(--soluk);font-size:13px;line-height:1.3;min-height:120px;cursor:pointer;border-radius:inherit;padding:8px}
.resim-hata.buyuk-resim,.resim-hata.kart-resim{aspect-ratio:4/3}

/* Soru inceleme: kaydırılabilir kartlar */
.sahne{overflow:hidden;touch-action:pan-y;margin:0 -16px}
.ray{display:flex;transform:translateX(-100%)}
.slayt{flex:0 0 100%;padding:0 16px;perspective:1400px;min-width:0}
.kart{touch-action:manipulation;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kart.cevrik{transform:rotateY(180deg)}
.yuz{border-radius:16px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.yuz.on{position:relative;background:#fff;min-height:200px;display:flex;align-items:center;transform:rotateY(0deg)}
.yuz.arka{position:absolute;inset:0;transform:rotateY(180deg);background:var(--kart2);display:flex;align-items:center;justify-content:center}
.kart-resim{width:100%;display:block}
.yuz.arka .kart-resim{width:100%;height:100%;object-fit:contain;background:#fff}
.arka-etiket{position:absolute;top:10px;left:10px;background:var(--yesil);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:1}
.arka-bos{text-align:center;color:var(--soluk);padding:24px 20px;max-height:100%;overflow:auto}
.arka-bos .simge{font-size:34px;display:block;margin-bottom:6px}
.arka-bos b{color:var(--yazi);display:block;margin-bottom:6px}
.arka-bos p{white-space:pre-wrap;color:var(--yazi);text-align:left;margin:12px 0 0}
.gezgin{display:flex;align-items:center;gap:10px}
.gezgin button{flex:1;margin:0;background:var(--kart2);color:var(--yazi);font-weight:600;transition:opacity .2s}
.gezgin button.pasif{opacity:.35}
.sayac{color:var(--soluk);font-size:14px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.bildirim{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#2c313d;color:var(--yazi);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.bildirim.goster{opacity:1;transform:translate(-50%,0)}

/* Listeler */
.liste{list-style:none;margin:0;padding:0;border-radius:18px;position:relative}
.liste li{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative;background:var(--kart);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.liste li:first-child{border-radius:18px 18px 0 0}
.liste li:last-child{border-radius:0 0 18px 18px}
.liste li:only-child{border-radius:18px}
.liste li+li::before{content:'';position:absolute;top:0;right:0;left:64px;border-top:1px solid var(--cizgi)}
.liste.duz li+li::before{left:14px}
.liste li:active{background:var(--kart2)}
.liste li.tutulan{z-index:3;background:var(--kart2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.55);transform:scale(1.02);transition:transform .15s,box-shadow .15s}
.liste.suruk li{transition:transform .18s ease}
.liste.suruk li.tutulan{transition:none}
.liste.suruk li::before,.liste li.tutulan::before,.liste li.tutulan+li::before{opacity:0}
.rozet{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--r);background:color-mix(in srgb,var(--r) 20%,transparent)}
.rozet svg{width:22px;height:22px}
.rozet.iri{width:60px;height:60px;border-radius:17px}
.rozet.iri svg{width:32px;height:32px}
.ad{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sayi{background:color-mix(in srgb,var(--ana) 22%,transparent);color:#a9c1ff;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px}
.ok{color:#4a505c;font-size:24px;line-height:1;margin-top:-2px}
.ipucu{color:#5a616e;font-size:12.5px;text-align:center;margin:10px 8px 0}

/* Butonlar */
button{font:inherit;border:0;border-radius:14px;padding:15px;width:100%;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5}
.ana{background:var(--ana);color:#fff;font-weight:700}
.ikincil{background:var(--kart);color:var(--ana);font-weight:600}
.tehlike{background:none;color:var(--kirmizi);margin-top:20px;font-size:15px}
.ince{background:none;color:var(--ana);margin-top:20px;font-size:15px;padding:10px}
#alt{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(14,16,20,0),var(--bg) 40%)}
#alt:empty{display:none}
#alt>*{max-width:688px;margin-left:auto;margin-right:auto}
.iki{display:flex;gap:10px}.iki button{flex:1}
.yesil{background:var(--yesil);color:#fff;font-weight:700}
.kirmizi{background:var(--kirmizi);color:#fff;font-weight:700}

/* Soru görselleri */
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:4px}
.izgara .bos{grid-column:1/-1}
.kutu{position:relative;cursor:pointer}
.kutu img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#fff;display:block}
.etiketcik{position:absolute;left:7px;top:7px;background:var(--ana);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.buyuk-resim{width:100%;border-radius:16px;display:block;margin-top:8px;background:#fff}
.yol{color:var(--soluk);font-size:14px;margin:4px 2px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.yol span{background:var(--kart);padding:3px 10px;border-radius:999px}

/* Form */
.etiket{color:var(--soluk);font-size:14px;margin:18px 2px 6px;display:block}
.foto{display:flex;align-items:center;justify-content:center;text-align:center;min-height:190px;border:2px dashed var(--cizgi);border-radius:18px;color:var(--soluk);cursor:pointer;overflow:hidden;position:relative;background:var(--kart)}
.foto.kucuk{min-height:90px;margin-top:12px}
.foto span{width:100%;padding:12px}
.foto .simge{font-size:30px;display:block;margin-bottom:4px}
.foto img{width:100%;display:block;background:#fff}
.foto.dolu{border-style:solid}
.foto.dolu span{padding:0}
.gizli{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
textarea,input.yazi{width:100%;font:inherit;color:var(--yazi);background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:13px}
textarea:focus,input.yazi:focus{outline:none;border-color:var(--ana)}

/* Ders düzenleme */
.onizleme{display:flex;gap:12px;align-items:center;margin-top:4px}
.onizleme input{font-size:18px;font-weight:600}
.renkler{display:flex;flex-wrap:wrap;gap:12px;padding:2px}
.renk{width:36px;height:36px;padding:0;margin:0;border-radius:50%;background:var(--r);border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.renk.secili{box-shadow:0 0 0 2px var(--r)}
.ikonlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.ikon-sec{margin:0;padding:0;aspect-ratio:1;display:grid;place-items:center;background:var(--kart);color:#aab1bd;border:2px solid transparent;border-radius:14px}
.ikon-sec svg{width:25px;height:25px}
.ikon-sec.secili{color:var(--r);border-color:var(--r);background:color-mix(in srgb,var(--r) 16%,var(--kart))}

/* Alttan açılan menü */
.perde{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .22s}
.perde.acik{background:rgba(0,0,0,.55)}
.sayfa-alt{width:100%;max-width:520px;padding:0 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.perde.acik .sayfa-alt{transform:none}
.secenek-grup{background:#252a34;border-radius:16px;overflow:hidden}
.secenek-baslik{color:var(--soluk);font-size:13px;text-align:center;padding:13px 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.secenek-baslik .rozet{width:28px;height:28px;border-radius:8px}
.secenek-baslik .rozet svg{width:17px;height:17px}
.secenek-grup button{margin:0;border-radius:0;background:none;color:var(--ana);font-size:18px;border-top:1px solid #333947;padding:16px}
.secenek-grup button.kirmizi-yazi{color:var(--kirmizi)}
.vazgec{background:#252a34;color:var(--ana);font-weight:700;font-size:18px;margin-top:8px}

/* Çözüm / tekrar */
.cozum{margin-top:16px;background:var(--kart);border-radius:16px;padding:2px 16px 12px}
.cozum summary{padding:13px 0;color:var(--ana);font-weight:700;cursor:pointer;list-style:none}
.cozum summary::-webkit-details-marker{display:none}
.cozum[open] summary{color:var(--soluk)}
.metin{white-space:pre-wrap;margin:4px 0 8px}
.not{background:#2e2716;color:#f3d98b;padding:11px 14px;border-radius:14px;white-space:pre-wrap;margin-top:12px}
.bos{color:var(--soluk);text-align:center;padding:26px 8px;margin:0}
.kucuk-yazi{color:var(--soluk);font-size:13px;text-align:center;margin-top:16px}
.ilerleme{height:5px;background:var(--kart2);border-radius:999px;overflow:hidden;margin:2px 0 12px}
.ilerleme div{height:100%;background:var(--ana);border-radius:999px;transition:width .3s}
.bitti{text-align:center;padding:48px 0;font-size:18px}
.bitti .emoji{font-size:60px;margin:0}
</style>
</head>
<body>
<header><button id="geri" hidden aria-label="Geri">‹</button><h1 id="baslik">Soru Defteri</h1></header>
<main id="icerik"></main>
<div id="alt"></div>
<script>
// ================= Simgeler (vektörel, 24x24) =================
const IKON = {
  // matematik
  pi:        '<path d="M4 7h16M9 7v12M15 7v9a3 3 0 0 0 3 3"/>',
  sigma:     '<path d="M18 5H6l6 7-6 7h12"/>',
  karekok:   '<path d="M3 13h3l3 7 5-16h7"/>',
  bolme:     '<circle cx="12" cy="6" r="1.4"/><path d="M5 12h14"/><circle cx="12" cy="18" r="1.4"/>',
  sonsuz:    '<path d="M6 8a4 4 0 1 0 0 8c3 0 9-8 12-8a4 4 0 1 1 0 8c-3 0-9-8-12-8z"/>',
  grafik:    '<path d="M3 3v18h18"/><path d="M7 16l4-5 3 3 5-7"/>',
  hesap:     '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.5M12 12h.5M16 12h.5M8 16h.5M12 16h.5M16 16h.5"/>',
  // geometri
  pergel:    '<circle cx="12" cy="5" r="2"/><path d="M11 7L5.5 21M13 7l5.5 14M7.5 15.5h9"/>',
  cetvel:    '<rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>',
  gonye:     '<path d="M4 20V4l16 16z"/><path d="M8 16v-3.5l3.5 3.5z"/>',
  ucgen:     '<path d="M12 4l9 16H3z"/>',
  kup:       '<path d="M12 2.5l8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5z"/><path d="M3.5 7.25L12 12l8.5-4.75M12 12v9.5"/>',
  // fen
  atom:      '<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>',
  miknatis:  '<path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3z"/><path d="M6 7h4M14 7h4"/>',
  simsek:    '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  dalga:     '<path d="M2 12c2-5 4-5 6 0s4 5 6 0 4-5 6 0"/>',
  ampul:     '<path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7v.5h6v-.5c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 2.5z"/>',
  erlen:     '<path d="M9 3h6M10 3v6L4.3 18.6A1.6 1.6 0 0 0 5.7 21h12.6a1.6 1.6 0 0 0 1.4-2.4L14 9V3"/><path d="M7 15h10"/>',
  tup:       '<path d="M8 3h8M10 3v14a2 2 0 0 0 4 0V3M10 11h4"/>',
  dna:       '<path d="M6 2c0 5 12 7 12 10S6 17 6 22"/><path d="M18 2c0 5-12 7-12 10s12 5 12 10"/><path d="M8.5 6h7M8.5 18h7"/>',
  yaprak:    '<path d="M5 21c0-9 5-16 16-16 0 11-7 16-16 16z"/><path d="M5 21l9-9"/>',
  kalp:      '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
  // edebî
  kitap:     '<path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
  kalem:     '<path d="M17 3l4 4L8 20H4v-4z"/><path d="M14 6l4 4"/>',
  metin:     '<path d="M4 6h16M4 10.5h16M4 15h16M4 19.5h10"/>',
  balon:     '<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5A8.5 8.5 0 1 1 21 11.5z"/>',
  // sosyal
  dunya:     '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  harita:    '<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  dag:       '<path d="M2 20l7-12 4 6 3-4 6 10z"/>',
  pusula:    '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  sutun:     '<path d="M3 21h18M5 21V10M9.5 21V10M14.5 21V10M19 21V10M2 10h20L12 3z"/>',
  kumsaati:  '<path d="M6 2h12M6 22h12M7 2v3l5 7-5 7v3M17 2v3l-5 7 5 7v3"/>',
  hilal:     '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  // genel
  yildiz:    '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  kep:       '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5M22 9v6"/>'
};
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[n] || IKON.kitap}</svg>`;
const RENKLER = ['#ff6b6b','#ff922b','#fcc419','#94d82d','#51cf66','#20c997','#22b8cf','#5b8cff','#9775fa','#f06595','#adb5bd'];
const VARSAYILAN_STIL = {
  "Türkçe": ["kitap", "#ff6b6b"], "Edebiyat": ["kalem", "#ff6b6b"], "Matematik": ["pi", "#5b8cff"],
  "Geometri": ["pergel", "#22b8cf"], "Fizik": ["atom", "#9775fa"], "Kimya": ["erlen", "#20c997"],
  "Biyoloji": ["dna", "#51cf66"], "Tarih": ["sutun", "#fcc419"], "Coğrafya": ["dunya", "#ff922b"],
  "Felsefe": ["balon", "#f06595"], "Din Kültürü": ["hilal", "#94d82d"]
};

// ================= Müfredat (uygulamadan değiştirilebilir) =================
const MUFREDAT = {

let db;
function dbAc(){
  return new Promise((ok, hata) => {
    const r = indexedDB.open('soruDefteri', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('sorular', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => hata(r.error);
  });
}
function istek(mod, fn){
  return new Promise((ok, hata) => {
    const t = db.transaction('sorular', mod);
    const r = fn(t.objectStore('sorular'));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = () => hata(t.error);
    t.onabort = () => hata(t.error);
  });
}
const hepsi  = () => istek('readonly',  s => s.getAll());
const getir  = id => istek('readonly',  s => s.get(id));
const kaydet = soru => istek('readwrite', s => { s.put(soru); });
const sil    = id => istek('readwrite', s => { s.delete(id); });

function dersler(){

}

async function duzenle(){

  let degisti = !localStorage.getItem('sd_dersler_v2');
  for (const k of ['TYT', 'AYT']) for (const x of d[k]) {
    if (!x.ikon || !IKON[x.ikon]) { const v = VARSAYILAN_STIL[x.ad] || ['kitap', '#adb5bd']; x.ikon = v[0]; x.renk = x.renk || v[1]; degisti = true; }
  }
  for (const s of sorular) {
    const k = sinavi(s);
    let ders = d[k].find(x => x.ad === s.ders);
    if (!ders) { const v = VARSAYILAN_STIL[s.ders] || ['kitap', '#adb5bd']; ders = { ad: s.ders, konular: [], ikon: v[0], renk: v[1] }; d[k].push(ders); degisti = true; }

}

// Fotoğrafı küçültüp sıkıştırır, telefonda yer kaplamasın diye
async function kucult(dosya){
  const img = await new Promise((ok, hata) => {
    const i = new Image();
    i.onload = () => ok(i); i.onerror = hata;
    i.src = URL.createObjectURL(dosya);
  });
  const max = 1600;
  const oran = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * oran);
  c.height = Math.round(img.naturalHeight * oran);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
}

// ================= Görsel yükleme sistemi =================
// Kayıtlı görseller önce belleğe kopyalanır, sonra gösterilir. iPhone'da veritabanından
// okunan dosyalar ilk denemede bazen açılamıyor; kopyalama ve yeniden deneme bunu çözer.
// Hazırlanan görseller önbellekte tutulur, ekran değişince silinmez.
const BOS_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const onbellek = new Map();   // "id:s" / "id:c" -> görsel adresi
const bekleyen = new Map();   // ekrana yazılmış ama henüz hazırlanmamış görseller
const sozler = new Map();     // aynı görsel iki kez hazırlanmasın
const bekle = ms => new Promise(r => setTimeout(r, ms));

function resim(s, tur, sinif = ''){
  const blob = tur === 'c' ? s.cozumImg : s.soruImg;
  if (!blob) return '';
  const k = s.id + ':' + tur, u = onbellek.get(k);
  if (u) return `<img class="${sinif}" src="${u}" data-k="${k}" alt="" decoding="async">`;
  bekleyen.set(k, blob);
  return `<img class="${sinif} yukleniyor" src="${BOS_GIF}" data-k="${k}" alt="">`;
}

function adresAl(k){
  if (onbellek.has(k)) return Promise.resolve(onbellek.get(k));
  if (!sozler.has(k)) sozler.set(k, (async () => {
    let blob = bekleyen.get(k), veri = null;
    for (let deneme = 0; deneme < 3; deneme++) {
      try {
        if (!blob || deneme > 0) {
          const [id, tur] = k.split(':'), s = await getir(id);
          blob = s && (tur === 'c' ? s.cozumImg : s.soruImg);
          if (!blob) throw new Error('Görsel bulunamadı');
        }
        veri = await blob.arrayBuffer();
        if (veri.byteLength) break;
        throw new Error('Boş görsel');
      } catch (e) {
        if (deneme === 2) throw e;
        await bekle(150 * (deneme + 1));
      }
    }
    const u = URL.createObjectURL(new Blob([veri], { type: blob.type || 'image/jpeg' }));
    onbellek.set(k, u); bekleyen.delete(k); sinirla();
    return u;
  })().finally(() => sozler.delete(k)));
  return sozler.get(k);
}

function resimYukle(img){
  const k = img.dataset.k;
  adresAl(k).then(u => {
    if (!img.isConnected) return;
    img.onload = () => { if (img.src === u) img.classList.remove('yukleniyor'); };
    img.onerror = () => resimHata(img);
    img.src = u;
  }).catch(() => resimHata(img));
}

function resimHata(img){
  if (!img.isConnected) return;
  const k = img.dataset.k;
  if (!img.dataset.tekrar) {             // bir kez sessizce yeniden dene
    img.dataset.tekrar = '1';
    const u = onbellek.get(k); if (u) { URL.revokeObjectURL(u); onbellek.delete(k); }
    img.src = BOS_GIF; img.classList.add('yukleniyor');
    resimYukle(img); return;
  }
  const d = document.createElement('div');
  d.className = img.className.replace('yukleniyor', '') + ' resim-hata';
  d.innerHTML = '<span>⚠️ Görsel yüklenemedi<br><small>Tekrar denemek için dokun</small></span>';
  d.onclick = e => {
    e.stopPropagation();
    const yeni = document.createElement('img');
    yeni.className = d.className.replace('resim-hata', '') + ' yukleniyor';
    yeni.src = BOS_GIF; yeni.alt = ''; yeni.dataset.k = k;
    d.replaceWith(yeni); resimYukle(yeni);
  };
  img.replaceWith(d);
}

function resimleriYukle(){ document.querySelectorAll('img.yukleniyor[data-k]').forEach(resimYukle); }

// Önbellek çok büyürse ekranda olmayan en eski görselleri bırak
function sinirla(){
  if (onbellek.size <= 150) return;
  const ekrandakiler = new Set([...document.querySelectorAll('img[data-k]')].map(i => i.dataset.k));
  for (const [k, u] of onbellek) {
    if (onbellek.size <= 120) break;
    if (ekrandakiler.has(k)) continue;
    URL.revokeObjectURL(u); onbellek.delete(k);
  }
}
function onbellekSil(id){
  for (const t of ['s', 'c']) { const k = id + ':' + t, u = onbellek.get(k); if (u) URL.revokeObjectURL(u); onbellek.delete(k); bekleyen.delete(k); }

// ================= Basılı tut: sürükle (sırala) ya da bırak (menü) =================
let suruklemeAktif = false;
function surukle(ul, sirala, menu){
  if (!ul) return;
  let li = null, zaman = null, tutuldu = false, aktif = false, bastir = false;
  let basX = 0, basY = 0, basS = 0, sonY = 0, ogeler = [], kutular = [], eski = 0, yeni = 0, raf = 0;
  const nokta = e => (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;

  function bas(e){
    if (e.type === 'mousedown') { if (e.button !== 0) return; window.addEventListener('mousemove', oynat); window.addEventListener('mouseup', birak); }
    const h = e.target.closest('li');
    if (!h || h.parentNode !== ul) return;
    li = h; const q = nokta(e);
    basX = q.clientX; basY = sonY = q.clientY; basS = scrollY; tutuldu = aktif = false;
    clearTimeout(zaman);
    zaman = setTimeout(() => {
      tutuldu = true; suruklemeAktif = true; li.classList.add('tutulan');
      try { navigator.vibrate && navigator.vibrate(12); } catch {}
    }, 420);
  }
  function oynat(e){
    if (!li) return;
    const q = nokta(e), dx = q.clientX - basX, dy = q.clientY - basY;
    if (!tutuldu) { if (Math.hypot(dx, dy) > 8) { clearTimeout(zaman); li = null; } return; }
    if (e.cancelable) e.preventDefault();
    sonY = q.clientY;
    if (!aktif) { if (Math.abs(dy) < 5) return; aktif = true; baslat(); }
    yerlestir();
  }
  function baslat(){
    ul.classList.add('suruk');
    ogeler = [...ul.children]; eski = yeni = ogeler.indexOf(li);
    kutular = ogeler.map(o => { const r = o.getBoundingClientRect(); return { ust: r.top + scrollY, h: r.height }; });
    raf = requestAnimationFrame(dongu);
  }
  function yerlestir(){
    const k0 = kutular[eski];
    let dy = (sonY + scrollY) - (basY + basS);
    dy = Math.max(kutular[0].ust - k0.ust, Math.min(kutular[kutular.length - 1].ust - k0.ust, dy));
    li.style.transform = `translateY(${dy}px) scale(1.02)`;
    const m = k0.ust + dy + k0.h / 2;
    let y = eski;
    for (let n = eski + 1; n < kutular.length; n++) if (m > kutular[n].ust + kutular[n].h / 2) y = n;
    for (let n = eski - 1; n >= 0; n--) if (m < kutular[n].ust + kutular[n].h / 2) y = n;
    yeni = y;
    ogeler.forEach((o, n) => {
      if (o === li) return;
      let s = 0;
      if (eski < yeni && n > eski && n <= yeni) s = -k0.h;
      else if (eski > yeni && n < eski && n >= yeni) s = k0.h;
      o.style.transform = s ? `translateY(${s}px)` : '';
    });
  }
  function dongu(){
    if (!aktif) return;
    const kenar = 90, alt = innerHeight - 90; let v = 0;
    if (sonY < kenar + 40) v = -Math.ceil((kenar + 40 - sonY) / 7);
    else if (sonY > alt) v = Math.ceil((sonY - alt) / 7);
    if (v) { window.scrollBy(0, v); yerlestir(); }
    raf = requestAnimationFrame(dongu);
  }
  function birak(e){
    if (e.type === 'mouseup') { window.removeEventListener('mousemove', oynat); window.removeEventListener('mouseup', birak); }
    clearTimeout(zaman);
    if (!li) return;
    const t = li, ts = tutuldu, ak = aktif;
    li = null; tutuldu = aktif = false;
    cancelAnimationFrame(raf);
    if (ts) { if (e.cancelable) e.preventDefault(); bastir = true; setTimeout(() => bastir = false, 400); }
    if (ak) {
      const a = eski, b = yeni;
      ogeler.forEach(o => o.style.transform = ''); ul.classList.remove('suruk'); t.classList.remove('tutulan');
      if (a !== b) sirala(a, b);
    } else if (ts) {
      t.classList.remove('tutulan'); menu(+t.dataset.i);
    }
    setTimeout(() => suruklemeAktif = false, 60);
  }
  ul.addEventListener('click', e => { if (bastir) { e.stopPropagation(); e.preventDefault(); bastir = false; } }, true);
  ul.addEventListener('contextmenu', e => e.preventDefault());
  ul.addEventListener('touchstart', bas, { passive: true });
  ul.addEventListener('touchmove', oynat, { passive: false });
  ul.addEventListener('touchend', birak);
  ul.addEventListener('touchcancel', birak);
  ul.addEventListener('mousedown', bas);
}

(function(){
  let s = null;
  const kay = (d, anim) => [icerik, alt].forEach(el => {
    el.style.transition = anim ? 'transform .22s ease, opacity .22s ease' : 'none';
    el.style.transform = d ? `translateX(${d}px)` : '';
    el.style.opacity = d ? String(1 - Math.min(.6, d / innerWidth * .8)) : '';
  });
  document.addEventListener('touchstart', e => {
    s = null;
    if (gecmis.length < 2 || e.touches.length !== 1 || document.querySelector('.perde')) return;
    if (e.target.closest('.serit, input, textarea')) return;
    const t = e.touches[0];
    // Soru kartlarının üstünde kaydırma soru değiştirir; sayfadan çıkmak için ekranın sol kenarından kaydır
    if (e.target.closest('.sahne') && t.clientX > 24) return;
    s = { x: t.clientX, y: t.clientY, a: false, d: 0, v: 0, lx: t.clientX, lt: Date.now() };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!s) return;
    if (suruklemeAktif) { if (s.a) kay(0, true); s = null; return; }
    const t = e.touches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (!s.a) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s = null; return; }
      if (dx > 10 && dx > Math.abs(dy) * 1.2) s.a = true; else return;
    }
    if (e.cancelable) e.preventDefault();
    const simdi = Date.now();
    s.v = (t.clientX - s.lx) / Math.max(1, simdi - s.lt); s.lx = t.clientX; s.lt = simdi;
    s.d = Math.max(0, dx); kay(s.d, false);
  }, { passive: false });
  const bitir = () => {
    if (!s) return;
    const o = s; s = null;
    if (!o.a) return;
    if (o.d > innerWidth * .3 || (o.d > 40 && o.v > .4)) {
      kay(innerWidth, true);
      setTimeout(() => { kay(0, false); geri(); }, 200);
    } else kay(0, true);
  };
  document.addEventListener('touchend', bitir);
  document.addEventListener('touchcancel', bitir);
})();

function dersFormu(k, i){
  const mevcut = i !== undefined ? dersler()[k][i] : null;
  let ikon = mevcut ? mevcut.ikon : 'kitap', renk = mevcut ? mevcut.renk : RENKLER[7];
  ekran(mevcut ? 'Dersi düzenle' : 'Yeni ders', `

    icerik.querySelectorAll('.renk').forEach(b => b.classList.toggle('secili', b.dataset.r === renk));
    icerik.querySelectorAll('.ikon-sec').forEach(b => { b.classList.toggle('secili', b.dataset.ik === ikon); b.style.setProperty('--r', renk); });
  };
  boya();
  icerik.querySelector('.renkler').onclick = e => { const b = e.target.closest('.renk'); if (b) { renk = b.dataset.r; boya(); } };
  icerik.querySelector('.ikonlar').onclick = e => { const b = e.target.closest('.ikon-sec'); if (b) { ikon = b.dataset.ik; boya(); } };
  $('#dersKaydet').onclick = async e => {
    const ad = $('#dersAd').value.trim();
    if (!ad) { alert('Ders adını yaz.'); return; }
    const d = dersler();
    if (d[k].some((x, n) => x.ad === ad && n !== i)) { alert('Bu isimde bir ders zaten var.'); return; }
    e.target.disabled = true;
    if (mevcut) {
      const eskiAd = d[k][i].ad;
      Object.assign(d[k][i], { ad, ikon, renk });

        for (const s of (await hepsi()).filter(s => sinavi(s) === k && s.ders === eskiAd)) { s.ders = ad; await kaydet(s); }

    dersKaydet(d); geri();

async function dersSil(k, i){
  const d = dersler(), ders = d[k][i];
  const sorular = (await hepsi()).filter(s => sinavi(s) === k && s.ders === ders.ad);
  const mesaj = sorular.length

  if (!confirm(mesaj)) return;
  for (const s of sorular) await sil(s.id);
  d[k].splice(i, 1); dersKaydet(d);
  if (gecmis[gecmis.length - 1].fn === dersSayfasi) gecmis.pop();
  yenile();
}

async function konuAdlandir(k, i, j){

// Çift dokunuş: kartı çevir. Dokunmatikte iki dokunuş arası süreye bakılır; farede çift tıklama.
let sonCevirme = 0;
function kartCevir(kart){ if (!kart) return; kart.classList.toggle('cevrik'); sonCevirme = Date.now(); }
function ciftDokunmaKur(alan){
  if (!alan) return;
  let bas = null, sonDokunus = 0;
  alan.addEventListener('touchstart', e => { const p = e.touches[0]; bas = e.touches.length === 1 ? { x: p.clientX, y: p.clientY, t: Date.now() } : null; }, { passive: true });
  alan.addEventListener('touchmove', e => { if (bas) { const p = e.touches[0]; if (Math.hypot(p.clientX - bas.x, p.clientY - bas.y) > 10) bas = null; } }, { passive: true });
  alan.addEventListener('touchend', e => {
    if (!bas || Date.now() - bas.t > 300) { bas = null; return; }
    bas = null;
    const simdi = Date.now();
    if (simdi - sonDokunus < 320) { kartCevir(e.target.closest('.kart')); sonDokunus = 0; if (e.cancelable) e.preventDefault(); }
    else sonDokunus = simdi;
  });
  alan.addEventListener('dblclick', e => { if (Date.now() - sonCevirme < 600) return; kartCevir(e.target.closest('.kart')); });
}

// ================= Soru inceleme (sorular arası ileri / geri) =================
const listeler = { son: [], konu: [] };
function incele(liste, n){ git(soruInceleme, (listeler[liste] || []).slice(), n); }
function soruDetay(id){ return soruInceleme([id], 0); }

async function soruInceleme(ids, n){
  if (!ids.length) { geri(); return; }
  n = Math.max(0, Math.min(n, ids.length - 1));
  const g = gecmis[gecmis.length - 1]; if (g && g.fn === soruInceleme) g.args = [ids, n];
  const [onceki, s, sonraki] = await Promise.all([
    n > 0 ? getir(ids[n - 1]) : null, getir(ids[n]), n < ids.length - 1 ? getir(ids[n + 1]) : null
  ]);
  if (!s) { ids.splice(n, 1); return soruInceleme(ids, n); }
  const slayt = x => `<div class="slayt">${x ? kartHtml(x) : ''}</div>`;
  const ilk = n === 0, son = n === ids.length - 1;
  ekran(s.konu, `
    ${yol(sinavi(s), s.ders, s.konu)}
    <div class="sahne" id="sahne"><div class="ray" id="ray">${slayt(onceki)}${slayt(s)}${slayt(sonraki)}</div></div>
    <p class="ipucu">Çözüm için karta iki kez dokun${ids.length > 1 ? ' · Diğer sorular için sağa sola kaydır' : ''}</p>
    ${s.not ? `<p class="not">${esc(s.not)}</p>` : ''}
    <details class="cozum"><summary>Çözümü göster</summary>${cozumHtml(s)}</details>
    <p class="kucuk-yazi">${s.tekrar || 0} kez tekrar edildi</p>
    <button class="tehlike" onclick="incelemeSil()">Soruyu sil</button>`,
    ids.length > 1 ? `<div class="gezgin"><button id="oncekiBtn" class="${ilk ? 'pasif' : ''}" aria-disabled="${ilk}">‹ Önceki</button><span class="sayac">${n + 1} / ${ids.length}</span><button id="sonrakiBtn" class="${son ? 'pasif' : ''}" aria-disabled="${son}">Sonraki ›</button></div>` : '');
  incelemeKur(ids, n);
}

function incelemeKur(ids, n){
  const sahne = $('#sahne'), ray = $('#ray');
  let gecis = false;
  const genislik = () => sahne.clientWidth;
  const konum = (dx, anim) => {
    ray.style.transition = anim ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
    ray.style.transform = `translateX(calc(-100% + ${dx}px))`;
  };
  const gec = yon => {
    if (gecis) return;
    const h = n + yon;
    if (h < 0) { konum(0, true); bildir('Bu ilk soru, öncesi yok'); return; }
    if (h >= ids.length) { konum(0, true); bildir('Son soruya geldin'); return; }
    gecis = true;
    konum(yon > 0 ? -genislik() : genislik(), true);
    setTimeout(() => soruInceleme(ids, h), 280);
  };
  const ob = $('#oncekiBtn'), sb = $('#sonrakiBtn');
  if (ob) ob.onclick = () => gec(-1);
  if (sb) sb.onclick = () => gec(1);

  // Kaydırma ve çift dokunuş
  let t = null, sonDokunus = 0;
  sahne.addEventListener('touchstart', e => {
    t = null;
    if (e.touches.length !== 1 || gecis) return;
    const p = e.touches[0];
    if (p.clientX <= 24) return;            // sol kenar: sayfadan çıkış hareketine bırak
    t = { x: p.clientX, y: p.clientY, z: Date.now(), yatay: false, iptal: false, dx: 0, v: 0, lx: p.clientX, lz: Date.now() };
  }, { passive: true });
  sahne.addEventListener('touchmove', e => {
    if (!t || t.iptal) return;
    const p = e.touches[0], dx = p.clientX - t.x, dy = p.clientY - t.y;
    if (!t.yatay) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { t.iptal = true; return; }
      if (Math.abs(dx) > 10) t.yatay = true; else return;
    }
    if (e.cancelable) e.preventDefault();
    const simdi = Date.now();
    t.v = (p.clientX - t.lx) / Math.max(1, simdi - t.lz); t.lx = p.clientX; t.lz = simdi; t.dx = dx;
    const uc = (n === 0 && dx > 0) || (n === ids.length - 1 && dx < 0);
    konum(uc ? dx * 0.3 : dx, false);         // uçlarda lastik gibi direnç
  }, { passive: false });
  sahne.addEventListener('touchend', e => {
    if (!t) return;
    const o = t; t = null;
    if (o.yatay) {
      const W = genislik();
      if (o.dx < -W * .25 || (o.dx < -40 && o.v < -.4)) gec(1);
      else if (o.dx > W * .25 || (o.dx > 40 && o.v > .4)) gec(-1);
      else konum(0, true);
      return;
    }
    if (o.iptal || Date.now() - o.z > 300) return;
    const simdi = Date.now();
    if (simdi - sonDokunus < 320) { kartCevir(e.target.closest('.kart')); sonDokunus = 0; if (e.cancelable) e.preventDefault(); }
    else sonDokunus = simdi;
  });
  sahne.addEventListener('touchcancel', () => { if (t && t.yatay) konum(0, true); t = null; });
  sahne.addEventListener('dblclick', e => { if (Date.now() - sonCevirme < 600) return; kartCevir(e.target.closest('.kart')); });
}

async function incelemeSil(){
  const g = gecmis[gecmis.length - 1], [ids, n] = g.args;
  if (!confirm('Bu soru silinsin mi?')) return;
  await sil(ids[n]); onbellekSil(ids[n]);
  ids.splice(n, 1);
  if (!ids.length) { geri(); return; }
  soruInceleme(ids, Math.min(n, ids.length - 1));
}

// ================= Tekrar modu =================
let oturum = null;
async function tekrarBaslat(k, i, j){
  let liste = await hepsi();
  const d = dersler();
  if (k !== undefined) {
    liste = liste.filter(s => sinavi(s) === k);
    if (i !== undefined) liste = liste.filter(s => s.ders === d[k][i].ad);
    if (j !== undefined) liste = liste.filter(s => s.konu === d[k][i].konular[j]);
  }
  if (!liste.length) { alert('Tekrar edilecek soru yok.'); return; }
  let secilen = liste.filter(sirasiGeldi);
  if (!secilen.length) {
    if (!confirm('Bugün sırası gelen soru yok. Yine de hepsini karışık tekrar etmek ister misin?')) return;
    secilen = liste;
  }
  oturum = { ids: karistir(secilen.map(s => s.id)), n: 0, bildi: 0 };
  git(tekrarEkrani);
}

async function tekrarEkrani(){
  if (!oturum) { geri(); return; }
  const toplam = oturum.ids.length;
  if (oturum.n >= toplam) {
    ekran('Tekrar bitti', `<div class="bitti"><p class="emoji">🎉</p><p><b>${toplam}</b> soruyu tekrar ettin.</p><p style="color:var(--soluk)">Bildiğin: ${oturum.bildi} · Bilemediğin: ${toplam - oturum.bildi}</p></div>`,
      `<button class="ana" onclick="tekrarBitir()">Tamam</button>`);
    return;
  }
  const s = await getir(oturum.ids[oturum.n]);
  if (!s) { oturum.n++; return tekrarEkrani(); }
  ekran(`Tekrar · ${oturum.n + 1} / ${toplam}`, `
    <div class="ilerleme"><div style="width:${oturum.n / toplam * 100}%"></div></div>
    ${yol(sinavi(s), s.ders, s.konu)}
    <div id="tekKart" style="perspective:1400px">${kartHtml(s)}</div>
    <p class="ipucu">Çözüm için karta iki kez dokun</p>
    ${s.not ? `<p class="not">${esc(s.not)}</p>` : ''}
    <details class="cozum"><summary>Çözümü göster</summary>${cozumHtml(s)}</details>`,
    `<div class="iki"><button class="kirmizi" onclick="cevap(false)">Bilemedim</button><button class="yesil" onclick="cevap(true)">Bildim</button></div>`);
  ciftDokunmaKur($('#tekKart'));
}

async function cevap(bildi){
  const s = await getir(oturum.ids[oturum.n]);
  if (s) {
    s.tekrar = (s.tekrar || 0) + 1;
    if (bildi) {
      s.seviye = Math.min((s.seviye || 0) + 1, ARALIK.length);
      s.sonraki = Date.now() + ARALIK[s.seviye - 1] * 864e5;
      oturum.bildi++;
    } else {
      s.seviye = 0;
      s.sonraki = Date.now(); // bilemediğin soru hemen tekrar sıraya girer
    }
    await kaydet(s);
  }
  oturum.n++; temizle(); tekrarEkrani();
}

function tekrarBitir(){ oturum = null; geri(); }
