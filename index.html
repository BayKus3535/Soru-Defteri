<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soru Defteri">
<meta name="theme-color" content="#000000">
<title>Soru Defteri</title>
<style>
:root{
  --bg:#000; --kart:#0f1012; --kart2:#16171a; --kart3:#1e1f23; --cizgi:#1f2024; --cizgi2:#2a2b30;
  --yazi:#f5f5f7; --soluk:#8e8e93; --soluk2:#5c5c62;
  --ana:#6366f1; --ana-acik:#a5b4fc; --yesil:#34d399; --kirmizi:#f87171; --mor:#a855f7;
  --tyt:linear-gradient(140deg,#4338ca 0%,#2563eb 55%,#0ea5e9 100%);
  --ayt:linear-gradient(140deg,#6d28d9 0%,#a21caf 60%,#db2777 100%);
  --nav-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(120% 60% at 100% 100%,rgba(99,102,241,.10),transparent 60%),radial-gradient(90% 40% at 0% 0%,rgba(99,102,241,.05),transparent 60%)}
body.navli{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}

/* Üst çubuk */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(0,0,0,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
header.golge{border-bottom-color:var(--cizgi)}
header h1{font-size:17px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
header.buyuk{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:14px}
header.buyuk h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
#geri{background:none;border:0;color:var(--ana-acik);font-size:36px;line-height:1;padding:0 10px 4px 0;width:auto;margin:0}
#arti{width:48px;height:48px;margin:0;padding:0;border-radius:15px;border:2px solid var(--ana);background:rgba(99,102,241,.12);color:var(--ana-acik);display:grid;place-items:center;flex:none}
#arti[hidden]{display:none}
#arti svg{width:24px;height:24px}
header:not(.buyuk) #arti{width:40px;height:40px;border-radius:12px}
main{padding:6px 16px 16px;max-width:720px;margin:0 auto}
h2{font-size:13px;color:var(--soluk);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:28px 4px 12px}

/* Alt menü */
#sekmeler{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;background:rgba(8,8,10,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--cizgi);padding:0 4px env(safe-area-inset-bottom)}
body.navli #sekmeler{display:flex}
#sekmeler button{flex:1;margin:0;padding:9px 0 7px;background:none;border-radius:0;color:var(--soluk2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;position:relative;min-width:0;height:var(--nav-h)}
#sekmeler button svg{width:24px;height:24px}
#sekmeler button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#sekmeler button.aktif{color:var(--yazi)}
#sekmeler button.aktif::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--yazi)}

/* Genel kart */
.kart-kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:16px}

/* Ana sayfa */
.selam{color:var(--soluk);margin:-6px 0 16px 2px;font-size:15px}
.hero{background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.22),transparent 70%);pointer-events:none}
.hero-etiket{display:inline-flex;align-items:center;gap:6px;color:var(--ana-acik);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero-etiket svg{width:16px;height:16px}
.hero-sayi{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.04em;margin-top:12px}
.hero-sayi small{font-size:18px;font-weight:600;color:var(--soluk);letter-spacing:0;margin-left:4px}
.hero-yazi{color:var(--soluk);margin-top:6px;font-size:15px}
.hero .ana{margin-top:16px}
.istatlar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:14px 12px;min-width:0}
.stat svg{width:18px;height:18px;color:var(--r,var(--ana-acik))}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.stat span{display:block;color:var(--soluk);font-size:12.5px;margin-top:3px;line-height:1.25}
.stat-izgara{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-izgara .stat b{font-size:28px}
.sinavlar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sinav{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#fff;cursor:pointer;min-height:160px;display:flex;flex-direction:column}
.sinav.tyt{background:var(--tyt)} .sinav.ayt{background:var(--ayt)}
.sinav::before{content:'';position:absolute;width:140px;height:140px;right:-45px;bottom:-55px;border-radius:50%;background:rgba(255,255,255,.12)}
.sinav-ad{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sinav-alt{opacity:.85;font-size:14px;font-weight:500}
.sinav-bilgi{position:relative;z-index:1;margin-top:auto;display:flex;flex-direction:column;gap:1px;font-size:13.5px}
.sinav-bilgi b{font-size:15px}
.serit{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.serit::-webkit-scrollbar{display:none}
.serit .kucuk{width:104px;height:104px;flex:none;border-radius:16px;overflow:hidden;background:var(--kart);border:1px solid var(--cizgi);cursor:pointer}
.serit .kucuk img,.serit .kucuk .resim-hata{width:100%;height:100%;object-fit:cover;display:block;background:#fff;min-height:0}
.baslangic{display:flex;gap:14px;align-items:center;cursor:pointer}
.baslangic .rozet{--r:var(--ana)}

/* Kart listeleri (dersler, konular, tekrar listeleri) */
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.liste li{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;position:relative;background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s}
.liste li:active{background:var(--kart2)}
.liste.duz{gap:8px}
.liste.duz li{padding:13px 12px 13px 14px;border-radius:18px;gap:12px}
.liste li.tutulan{z-index:3;background:var(--kart3);border-color:var(--ana);box-shadow:0 14px 36px rgba(0,0,0,.7);transform:scale(1.02);transition:transform .15s,box-shadow .15s}
.liste.suruk li{transition:transform .18s ease}
.liste.suruk li.tutulan{transition:none}
.rozet{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--r);background:color-mix(in srgb,var(--r) 10%,#121214);border:1.5px solid color-mix(in srgb,var(--r) 60%,transparent)}
.rozet svg{width:24px;height:24px}
.rozet.iri{width:64px;height:64px;border-radius:18px}
.rozet.iri svg{width:32px;height:32px}
.rozet.kucuk{width:40px;height:40px;border-radius:12px}
.rozet.kucuk svg{width:20px;height:20px}
.bilgi{flex:1;min-width:0}
.bilgi .ad{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liste.duz .bilgi .ad{font-size:16px;font-weight:600}
.alt-yazi{color:var(--soluk);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liste.duz .alt-yazi{font-size:13px}
.liste:not(.duz) .alt-yazi{white-space:normal;line-height:1.3}
.mini-bar{height:4px;background:var(--kart3);border-radius:9px;margin-top:9px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--r,var(--yesil));border-radius:9px}
.nokta{width:36px;height:36px;margin:0 -6px 0 0;padding:0;background:none;color:var(--soluk);display:grid;place-items:center;border-radius:10px;flex:none}
.nokta svg{width:22px;height:22px}
.nokta:active{background:var(--kart3)}
.tik{width:26px;height:26px;border-radius:50%;border:2px solid #3a3b40;margin:0;padding:0;background:none;display:grid;place-items:center;color:#04130c;flex:none}
.tik.dolu{background:var(--yesil);border-color:var(--yesil)}
.tik svg{width:15px;height:15px;stroke-width:3}
.sayi{background:rgba(99,102,241,.18);color:var(--ana-acik);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.ok{color:var(--soluk2);display:grid;place-items:center}
.ok svg{width:18px;height:18px}
.ipucu{color:var(--soluk2);font-size:12.5px;text-align:center;margin:12px 8px 0}
.ipucu.sol{text-align:left;margin:10px 4px 0}

/* TYT / AYT seçici */
.segment{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:4px;margin-bottom:16px}
.segment button{margin:0;padding:9px 6px;border-radius:12px;background:none;color:var(--soluk);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.segment button b{font-size:16px}
.segment button small{font-size:11.5px;opacity:.8}
.segment button.secili{background:var(--kart3);color:var(--yazi);box-shadow:inset 0 0 0 1px var(--cizgi2)}

/* Ders / konu özet kartı */
.ozet{display:flex;gap:14px;align-items:center;background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;padding:16px}
.ozet-ust{color:var(--soluk);font-size:12.5px;font-weight:700;letter-spacing:.06em}
.ozet-ad{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hap{display:inline-flex;align-items:center;gap:6px;width:auto;margin:12px 0 0;padding:8px 14px;border-radius:999px;background:var(--kart2);border:1px solid var(--cizgi2);color:var(--soluk);font-size:14px;font-weight:600}
.hap svg{width:15px;height:15px}
.hap.dolu{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.45);color:var(--yesil)}
.ilk-soru{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1.5px dashed var(--cizgi2);border-radius:20px;padding:30px 16px;color:var(--soluk);cursor:pointer;margin-top:4px}
.ilk-soru .rozet{--r:var(--ana)}

/* Butonlar */
button{font:inherit;border:0;border-radius:16px;padding:15px;width:100%;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5}
.ana{background:var(--ana);color:#fff;font-weight:700}
.ana:active{filter:brightness(1.1)}
.ikincil{background:var(--kart);border:1px solid var(--cizgi);color:var(--ana-acik);font-weight:600}
.tehlike{background:none;color:var(--kirmizi);margin-top:16px;font-size:15px;padding:10px}
.ince{background:none;color:var(--ana-acik);margin-top:16px;font-size:15px;padding:10px}
#alt{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),#000 40%)}
#alt:empty{display:none}
#alt>*{max-width:688px;margin-left:auto;margin-right:auto}
.iki{display:flex;gap:10px}.iki button{flex:1}
.yesil{background:var(--yesil);color:#03140d;font-weight:700}
.kirmizi{background:var(--kirmizi);color:#1f0505;font-weight:700}

/* Soru görselleri */
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.izgara .bos{grid-column:1/-1}
.kutu{position:relative;cursor:pointer;border-radius:16px;overflow:hidden;border:1px solid var(--cizgi)}
.kutu img,.kutu .resim-hata{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;display:block}
.etiketcik{position:absolute;left:8px;top:8px;background:var(--ana);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.buyuk-resim{width:100%;border-radius:14px;display:block;margin-top:8px;background:#fff}
.yol{color:var(--soluk);font-size:13.5px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.yol span{background:var(--kart);border:1px solid var(--cizgi);padding:3px 11px;border-radius:999px}

/* Görsel yükleme durumları */
img.yukleniyor{background:linear-gradient(100deg,var(--kart2) 30%,var(--kart3) 50%,var(--kart2) 70%) !important;background-size:300% 100% !important;animation:parilti 1.2s linear infinite}
img.yukleniyor.buyuk-resim,img.yukleniyor.kart-resim{aspect-ratio:4/3;height:auto}
@keyframes parilti{from{background-position:100% 0}to{background-position:-50% 0}}
.resim-hata{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--kart2) !important;color:var(--soluk);font-size:13px;line-height:1.3;min-height:120px;cursor:pointer;border-radius:inherit;padding:8px}
.resim-hata.buyuk-resim,.resim-hata.kart-resim{aspect-ratio:4/3}

/* Form */
.etiket{color:var(--soluk);font-size:14px;margin:18px 4px 8px;display:block}
.foto{display:flex;align-items:center;justify-content:center;text-align:center;min-height:200px;border:1.5px dashed var(--cizgi2);border-radius:20px;color:var(--soluk);cursor:pointer;overflow:hidden;position:relative;background:var(--kart)}
.foto.kucuk{min-height:90px;margin-top:12px}
.foto span{width:100%;padding:12px}
.foto .simge{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 10px;border-radius:16px;border:1.5px solid rgba(99,102,241,.6);background:rgba(99,102,241,.1);color:var(--ana-acik)}
.foto .simge svg{width:26px;height:26px}
.foto img{width:100%;display:block;background:#fff}
.foto.dolu{border-style:solid;border-color:var(--cizgi)}
.foto.dolu span{padding:0}
.gizli{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
textarea,input.yazi{width:100%;font:inherit;color:var(--yazi);background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:14px}
textarea:focus,input.yazi:focus{outline:none;border-color:var(--ana)}

/* Ders düzenleme */
.onizleme{display:flex;gap:12px;align-items:center}
.onizleme input{font-size:18px;font-weight:600}
.renkler{display:flex;flex-wrap:wrap;gap:12px;padding:2px}
.renk{width:36px;height:36px;padding:0;margin:0;border-radius:50%;background:var(--r);border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.renk.secili{box-shadow:0 0 0 2px var(--r)}
.ikonlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.ikon-sec{margin:0;padding:0;aspect-ratio:1;display:grid;place-items:center;background:var(--kart);border:1.5px solid var(--cizgi);color:#a1a1aa;border-radius:15px}
.ikon-sec svg{width:25px;height:25px}
.ikon-sec.secili{color:var(--r);border-color:var(--r);background:color-mix(in srgb,var(--r) 12%,var(--kart))}

/* Alttan açılan menü */
.perde{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .22s}
.perde.acik{background:rgba(0,0,0,.6)}
.sayfa-alt{width:100%;max-width:520px;padding:0 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.perde.acik .sayfa-alt{transform:none}
.secenek-grup{background:#1c1c1f;border:1px solid var(--cizgi2);border-radius:18px;overflow:hidden}
.secenek-baslik{color:var(--soluk);font-size:13px;text-align:center;padding:13px 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.secenek-baslik .rozet{width:28px;height:28px;border-radius:8px}
.secenek-baslik .rozet svg{width:16px;height:16px}
.secenek-grup button{margin:0;border-radius:0;background:none;color:var(--ana-acik);font-size:17px;border-top:1px solid var(--cizgi2);padding:16px}
.secenek-grup button.kirmizi-yazi{color:var(--kirmizi)}
.vazgec{background:#1c1c1f;border:1px solid var(--cizgi2);color:var(--yazi);font-weight:700;font-size:17px;margin-top:8px}

/* Soru inceleme: kaydırılabilir kartlar */
.sahne{overflow:hidden;touch-action:pan-y;margin:0 -16px}
.ray{display:flex;transform:translateX(-100%)}
.slayt{flex:0 0 100%;padding:0 16px;perspective:1400px;min-width:0}
.kart{touch-action:manipulation;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kart.cevrik{transform:rotateY(180deg)}
.yuz{border-radius:20px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:1px solid var(--cizgi)}
.yuz.on{position:relative;background:#fff;min-height:200px;max-height:68vh;display:flex;align-items:center;justify-content:center;transform:rotateY(0deg)}
.yuz.on .kart-resim{max-height:68vh;object-fit:contain}
.yuz.arka{position:absolute;inset:0;transform:rotateY(180deg);background:var(--kart2);display:flex;align-items:center;justify-content:center}
.kart-resim{width:100%;display:block}
.yuz.arka .kart-resim{width:100%;height:100%;object-fit:contain;background:#fff}
.arka-etiket{position:absolute;top:10px;left:10px;background:var(--yesil);color:#03140d;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;z-index:1}
.arka-bos{text-align:center;color:var(--soluk);padding:24px 20px;max-height:100%;overflow:auto}
.arka-bos .simge{font-size:34px;display:block;margin-bottom:6px}
.arka-bos b{color:var(--yazi);display:block;margin-bottom:6px}
.arka-bos p{white-space:pre-wrap;color:var(--yazi);text-align:left;margin:12px 0 0}
.gezgin{display:flex;align-items:center;gap:10px}
.gezgin button{flex:1;margin:0;background:var(--kart2);border:1px solid var(--cizgi2);color:var(--yazi);font-weight:600;transition:opacity .2s}
.gezgin button.pasif{opacity:.35}
.sayac{color:var(--soluk);font-size:14px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.bildirim{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#1f2024;border:1px solid var(--cizgi2);color:var(--yazi);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;white-space:nowrap}
.bildirim.goster{opacity:1;transform:translate(-50%,0)}

/* Çözüm / tekrar */
.cozum{margin-top:12px;background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:2px 16px 12px}
.cozum summary{padding:14px 0 12px;color:var(--ana-acik);font-weight:700;cursor:pointer;list-style:none}
.cozum summary::-webkit-details-marker{display:none}
.cozum[open] summary{color:var(--soluk)}
.metin{white-space:pre-wrap;margin:4px 0 8px}
.not{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.25);color:#fde68a;padding:11px 14px;border-radius:16px;white-space:pre-wrap;margin:12px 0 0}
.bos{color:var(--soluk);text-align:center;padding:26px 8px;margin:0}
.kucuk-yazi{color:var(--soluk);font-size:13px;text-align:center;margin-top:16px}
.ilerleme{height:5px;background:var(--kart3);border-radius:999px;overflow:hidden;margin:2px 0 14px}
.ilerleme div{height:100%;background:var(--ana);border-radius:999px;transition:width .3s}
.hero .ilerleme{margin:14px 0 0}
.hero .ilerleme div{background:var(--yesil)}
.bitti{text-align:center;padding:48px 0;font-size:18px}
.bitti .emoji{font-size:60px;margin:0}

/* İstatistikler */
.grafik{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.gun{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.cubuklar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.cubuklar i{width:38%;max-width:12px;border-radius:4px 4px 2px 2px;min-height:3px}
.c1{background:var(--ana)} .c2{background:var(--yesil)}
.gun span{font-size:11.5px;color:var(--soluk)}
.gun.bugun span{color:var(--yazi);font-weight:700}
.lejant{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12.5px;color:var(--soluk)}
.lejant span{display:flex;align-items:center;gap:6px}
.lejant i{width:10px;height:10px;border-radius:3px;display:inline-block}
.buyuk-sayi{font-size:30px;font-weight:800;letter-spacing:-.02em}
.buyuk-sayi small{font-size:15px;color:var(--soluk);font-weight:600}
.dagilim li{cursor:default}

/* Ayarlar */
.grup{background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;overflow:hidden}
.grup-satir{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.grup-satir+.grup-satir{border-top:1px solid var(--cizgi)}
.grup-satir span{color:var(--yazi)}
.grup-satir b{color:var(--soluk);font-weight:600;text-align:right}
.grup-satir p{margin:0;color:var(--soluk);font-size:14px}
.yesil-yazi{color:var(--yesil) !important}

/* Veri Durumu ve Yedekleme */
.grup-satir.tikla{cursor:pointer}
.grup-satir.tikla:active{background:var(--kart2)}
.grup-satir.ust-alt{flex-direction:column;align-items:stretch;gap:2px}
.grup-satir small{display:block;color:var(--soluk);font-size:12.5px;margin-top:2px}
.grup-satir code,.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.hash{word-break:break-all;color:var(--soluk);background:var(--kart2);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;margin:8px 0 0;font-size:12px;line-height:1.5}
.vd-not{display:flex;gap:10px;align-items:flex-start;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.3);color:#a7f3d0;border-radius:16px;padding:12px 14px;font-size:14px}
.vd-not svg{width:18px;height:18px;flex:none;margin-top:2px}
.stat.kirmizi-stat b{color:var(--kirmizi)}
.kontroller{list-style:none;margin:0;padding:0}
.kontroller li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:14px;border-top:1px solid var(--cizgi)}
.kontroller li:first-child{border-top:0}
.kontroller .isaret{flex:none;width:20px;text-align:center;font-weight:800}
.isaret.ok-i{color:var(--yesil)} .isaret.hata-i{color:var(--kirmizi)} .isaret.uyari-i{color:#fb923c} .isaret.bilgi-i{color:var(--soluk)}
.kontroller small{display:block;color:var(--soluk);font-size:12.5px;margin-top:2px;word-break:break-word}

let db;
function dbAc(){
  return new Promise((ok, hata) => {
    const r = indexedDB.open('soruDefteri', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('sorular', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; ok(); };
    r.onerror = () => hata(r.error);
  });
}
function istek(mod, fn){
  return new Promise((ok, hata) => {
    const t = db.transaction('sorular', mod);
    const r = fn(t.objectStore('sorular'));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = () => hata(t.error);
    t.onabort = () => hata(t.error);
  });
}
const hepsi  = () => istek('readonly',  s => s.getAll());
const getir  = id => istek('readonly',  s => s.get(id));
const kaydet = soru => istek('readwrite', s => { s.put(soru); });
const sil    = id => istek('readwrite', s => { s.delete(id); });

function dersler(){
  try {
    const d = JSON.parse(localStorage.getItem('sd_dersler_v2'));
    if (d && d.TYT && d.AYT) return d;
  } catch {}
  return JSON.parse(JSON.stringify(MUFREDAT));
}
function dersKaydet(d){ localStorage.setItem('sd_dersler_v2', JSON.stringify(d)); }

// ---- Tamamlanan konular (ayrı anahtarda; ders/konu/soru kayıtlarına dokunmaz) ----
const tk = (k, ad) => k + '|' + ad;
function tamamlar(){ try { return JSON.parse(localStorage.getItem('sd_tamam')) || {}; } catch { return {}; } }
function tamamKaydet(t){ try { localStorage.setItem('sd_tamam', JSON.stringify(t)); } catch {} }
function tamamMi(k, ad, konu){ return (tamamlar()[tk(k, ad)] || []).includes(konu); }
function tamamSay(k, d){ const l = tamamlar()[tk(k, d.ad)] || []; return d.konular.filter(x => l.includes(x)).length; }
function tamamDegis(k, ad, konu, deger){
  const t = tamamlar(), key = tk(k, ad), l = t[key] || [], i = l.indexOf(konu);
  const olsun = deger === undefined ? i < 0 : deger;
  if (olsun && i < 0) l.push(konu); else if (!olsun && i >= 0) l.splice(i, 1);
  t[key] = l; tamamKaydet(t);
}
function tamamDersAdi(k, eski, yeni){ const t = tamamlar(); if (t[tk(k, eski)]) { t[tk(k, yeni)] = t[tk(k, eski)]; delete t[tk(k, eski)]; tamamKaydet(t); } }

// Fotoğrafı küçültüp sıkıştırır, telefonda yer kaplamasın diye
async function kucult(dosya){
  const img = await new Promise((ok, hata) => {
    const i = new Image();
    i.onload = () => ok(i); i.onerror = hata;
    i.src = URL.createObjectURL(dosya);
  });
  const max = 1600;
  const oran = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * oran);
  c.height = Math.round(img.naturalHeight * oran);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
}

let gecmis = [], urller = [], sonrakiY = 0;
// url(): yalnızca "Soru ekle" ekranındaki geçici önizlemeler için
function url(blob){ const u = URL.createObjectURL(blob); urller.push(u); return u; }

// ================= Görsel yükleme sistemi =================
// Kayıtlı görseller önce belleğe kopyalanır, sonra gösterilir. iPhone'da veritabanından
// okunan dosyalar ilk denemede bazen açılamıyor; kopyalama ve yeniden deneme bunu çözer.
// Hazırlanan görseller önbellekte tutulur, ekran değişince silinmez.
const BOS_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const onbellek = new Map();   // "id:s" / "id:c" -> görsel adresi
const bekleyen = new Map();   // ekrana yazılmış ama henüz hazırlanmamış görseller
const sozler = new Map();     // aynı görsel iki kez hazırlanmasın
const bekle = ms => new Promise(r => setTimeout(r, ms));

function resim(s, tur, sinif = ''){
  const blob = tur === 'c' ? s.cozumImg : s.soruImg;
  if (!blob) return '';
  const k = s.id + ':' + tur, u = onbellek.get(k);
  if (u) return `<img class="${sinif}" src="${u}" data-k="${k}" alt="" decoding="async">`;
  bekleyen.set(k, blob);
  return `<img class="${sinif} yukleniyor" src="${BOS_GIF}" data-k="${k}" alt="">`;
}

function adresAl(k){
  if (onbellek.has(k)) return Promise.resolve(onbellek.get(k));
  if (!sozler.has(k)) sozler.set(k, (async () => {
    let blob = bekleyen.get(k), veri = null;
    for (let deneme = 0; deneme < 3; deneme++) {
      try {
        if (!blob || deneme > 0) {
          const [id, tur] = k.split(':'), s = await getir(id);
          blob = s && (tur === 'c' ? s.cozumImg : s.soruImg);
          if (!blob) throw new Error('Görsel bulunamadı');
        }
        veri = await blob.arrayBuffer();
        if (veri.byteLength) break;
        throw new Error('Boş görsel');
      } catch (e) {
        if (deneme === 2) throw e;
        await bekle(150 * (deneme + 1));
      }
    }
    const u = URL.createObjectURL(new Blob([veri], { type: blob.type || 'image/jpeg' }));
    onbellek.set(k, u); bekleyen.delete(k); sinirla();
    return u;
  })().finally(() => sozler.delete(k)));
  return sozler.get(k);
}

function resimYukle(img){
  const k = img.dataset.k;
  adresAl(k).then(u => {
    if (!img.isConnected) return;
    img.onload = () => { if (img.src === u) img.classList.remove('yukleniyor'); };
    img.onerror = () => resimHata(img);
    img.src = u;
  }).catch(() => resimHata(img));
}

function resimHata(img){
  if (!img.isConnected) return;
  const k = img.dataset.k;
  if (!img.dataset.tekrar) {             // bir kez sessizce yeniden dene
    img.dataset.tekrar = '1';
    const u = onbellek.get(k); if (u) { URL.revokeObjectURL(u); onbellek.delete(k); }
    img.src = BOS_GIF; img.classList.add('yukleniyor');
    resimYukle(img); return;
  }
  const d = document.createElement('div');
  d.className = img.className.replace('yukleniyor', '') + ' resim-hata';
  d.innerHTML = '<span>⚠️ Görsel yüklenemedi<br><small>Tekrar denemek için dokun</small></span>';
  d.onclick = e => {
    e.stopPropagation();
    const yeni = document.createElement('img');
    yeni.className = d.className.replace('resim-hata', '') + ' yukleniyor';
    yeni.src = BOS_GIF; yeni.alt = ''; yeni.dataset.k = k;
    d.replaceWith(yeni); resimYukle(yeni);
  };
  img.replaceWith(d);
}

function resimleriYukle(){ document.querySelectorAll('img.yukleniyor[data-k]').forEach(resimYukle); }

// Önbellek çok büyürse ekranda olmayan en eski görselleri bırak
function sinirla(){
  if (onbellek.size <= 150) return;
  const ekrandakiler = new Set([...document.querySelectorAll('img[data-k]')].map(i => i.dataset.k));
  for (const [k, u] of onbellek) {
    if (onbellek.size <= 120) break;
    if (ekrandakiler.has(k)) continue;
    URL.revokeObjectURL(u); onbellek.delete(k);
  }
}
function onbellekSil(id){
  for (const t of ['s', 'c']) { const k = id + ':' + t, u = onbellek.get(k); if (u) URL.revokeObjectURL(u); onbellek.delete(k); bekleyen.delete(k); }

// ================= Basılı tut: sürükle (sırala) ya da bırak (menü) =================
let suruklemeAktif = false;
function surukle(ul, sirala, menu){
  if (!ul) return;
  let li = null, zaman = null, tutuldu = false, aktif = false, bastir = false;
  let basX = 0, basY = 0, basS = 0, sonY = 0, ogeler = [], kutular = [], eski = 0, yeni = 0, raf = 0;
  const nokta = e => (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;

  function bas(e){
    if (e.type === 'mousedown') { if (e.button !== 0) return; window.addEventListener('mousemove', oynat); window.addEventListener('mouseup', birak); }
    const h = e.target.closest('li');
    if (!h || h.parentNode !== ul) return;
    li = h; const q = nokta(e);
    basX = q.clientX; basY = sonY = q.clientY; basS = scrollY; tutuldu = aktif = false;
    clearTimeout(zaman);
    zaman = setTimeout(() => {
      tutuldu = true; suruklemeAktif = true; li.classList.add('tutulan');
      try { navigator.vibrate && navigator.vibrate(12); } catch {}
    }, 420);
  }
  function oynat(e){
    if (!li) return;
    const q = nokta(e), dx = q.clientX - basX, dy = q.clientY - basY;
    if (!tutuldu) { if (Math.hypot(dx, dy) > 8) { clearTimeout(zaman); li = null; } return; }
    if (e.cancelable) e.preventDefault();
    sonY = q.clientY;
    if (!aktif) { if (Math.abs(dy) < 5) return; aktif = true; baslat(); }
    yerlestir();
  }
  function baslat(){
    ul.classList.add('suruk');
    ogeler = [...ul.children]; eski = yeni = ogeler.indexOf(li);
    kutular = ogeler.map(o => { const r = o.getBoundingClientRect(); return { ust: r.top + scrollY, h: r.height }; });
    raf = requestAnimationFrame(dongu);
  }
  function yerlestir(){
    const k0 = kutular[eski];
    let dy = (sonY + scrollY) - (basY + basS);
    dy = Math.max(kutular[0].ust - k0.ust, Math.min(kutular[kutular.length - 1].ust - k0.ust, dy));
    li.style.transform = `translateY(${dy}px) scale(1.02)`;
    const m = k0.ust + dy + k0.h / 2;
    let y = eski;
    for (let n = eski + 1; n < kutular.length; n++) if (m > kutular[n].ust + kutular[n].h / 2) y = n;
    for (let n = eski - 1; n >= 0; n--) if (m < kutular[n].ust + kutular[n].h / 2) y = n;
    yeni = y;
    // kartlar arası boşluk da kaydırma mesafesine eklenir
    const bosluk = kutular.length > 1 ? Math.max(0, kutular[1].ust - kutular[0].ust - kutular[0].h) : 0;
    const adim = k0.h + bosluk;
    ogeler.forEach((o, n) => {
      if (o === li) return;
      let s = 0;
      if (eski < yeni && n > eski && n <= yeni) s = -adim;
      else if (eski > yeni && n < eski && n >= yeni) s = adim;
      o.style.transform = s ? `translateY(${s}px)` : '';
    });
  }
  function dongu(){
    if (!aktif) return;
    const kenar = 90, alt = innerHeight - 90; let v = 0;
    if (sonY < kenar + 40) v = -Math.ceil((kenar + 40 - sonY) / 7);
    else if (sonY > alt) v = Math.ceil((sonY - alt) / 7);
    if (v) { window.scrollBy(0, v); yerlestir(); }
    raf = requestAnimationFrame(dongu);
  }
  function birak(e){
    if (e.type === 'mouseup') { window.removeEventListener('mousemove', oynat); window.removeEventListener('mouseup', birak); }
    clearTimeout(zaman);
    if (!li) return;
    const t = li, ts = tutuldu, ak = aktif;
    li = null; tutuldu = aktif = false;
    cancelAnimationFrame(raf);
    if (ts) { if (e.cancelable) e.preventDefault(); bastir = true; setTimeout(() => bastir = false, 400); }
    if (ak) {
      const a = eski, b = yeni;
      ogeler.forEach(o => o.style.transform = ''); ul.classList.remove('suruk'); t.classList.remove('tutulan');
      if (a !== b) sirala(a, b);
    } else if (ts) {
      t.classList.remove('tutulan'); menu(+t.dataset.i);
    }
    setTimeout(() => suruklemeAktif = false, 60);
  }
  ul.addEventListener('click', e => { if (bastir) { e.stopPropagation(); e.preventDefault(); bastir = false; } }, true);
  ul.addEventListener('contextmenu', e => e.preventDefault());
  ul.addEventListener('touchstart', bas, { passive: true });
  ul.addEventListener('touchmove', oynat, { passive: false });
  ul.addEventListener('touchend', birak);
  ul.addEventListener('touchcancel', birak);
  ul.addEventListener('mousedown', bas);
}

(function(){
  let s = null;
  const kay = (d, anim) => [icerik, alt].forEach(el => {
    el.style.transition = anim ? 'transform .22s ease, opacity .22s ease' : 'none';
    el.style.transform = d ? `translateX(${d}px)` : '';
    el.style.opacity = d ? String(1 - Math.min(.6, d / innerWidth * .8)) : '';
  });
  document.addEventListener('touchstart', e => {
    s = null;
    if (gecmis.length < 2 || e.touches.length !== 1 || document.querySelector('.perde')) return;
    if (e.target.closest('.serit, input, textarea')) return;
    const t = e.touches[0];
    // Soru kartlarının üstünde kaydırma soru değiştirir; sayfadan çıkmak için ekranın sol kenarından kaydır
    if (e.target.closest('.sahne') && t.clientX > 24) return;
    s = { x: t.clientX, y: t.clientY, a: false, d: 0, v: 0, lx: t.clientX, lt: Date.now() };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!s) return;
    if (suruklemeAktif) { if (s.a) kay(0, true); s = null; return; }
    const t = e.touches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (!s.a) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s = null; return; }
      if (dx > 10 && dx > Math.abs(dy) * 1.2) s.a = true; else return;
    }
    if (e.cancelable) e.preventDefault();
    const simdi = Date.now();
    s.v = (t.clientX - s.lx) / Math.max(1, simdi - s.lt); s.lx = t.clientX; s.lt = simdi;
    s.d = Math.max(0, dx); kay(s.d, false);
  }, { passive: false });
  const bitir = () => {
    if (!s) return;
    const o = s; s = null;
    if (!o.a) return;
    if (o.d > innerWidth * .3 || (o.d > 40 && o.v > .4)) {
      kay(innerWidth, true);
      setTimeout(() => { kay(0, false); geri(); }, 200);
    } else kay(0, true);
  };
  document.addEventListener('touchend', bitir);
  document.addEventListener('touchcancel', bitir);
})();

// ================= Ders ekle / düzenle =================
function dersFormu(k, i){
  const mevcut = i !== undefined ? dersler()[k][i] : null;
  let ikon = mevcut ? mevcut.ikon : 'kitap', renk = mevcut ? mevcut.renk : RENKLER[7];
  ekran(mevcut ? 'Dersi düzenle' : `Yeni ${k} dersi`, `
    <div class="onizleme"><span class="rozet iri" id="onRozet"></span><input class="yazi" id="dersAd" placeholder="Ders adı" value="${esc(mevcut ? mevcut.ad : '')}" autocomplete="off"></div>
    <h2>Renk</h2>
    <div class="renkler">${RENKLER.map(r => `<button class="renk" data-r="${r}" style="--r:${r}" aria-label="Renk"></button>`).join('')}</div>
    <h2>Simge</h2>
    <div class="ikonlar">${Object.keys(IKON).map(n => `<button class="ikon-sec" data-ik="${n}" aria-label="${n}">${svg(n)}</button>`).join('')}</div>`,
    `<button class="ana" id="dersKaydet">${mevcut ? 'Kaydet' : 'Dersi ekle'}</button>`);
  const boya = () => {
    const r = $('#onRozet'); r.style.setProperty('--r', renk); r.innerHTML = svg(ikon);
    icerik.querySelectorAll('.renk').forEach(b => b.classList.toggle('secili', b.dataset.r === renk));
    icerik.querySelectorAll('.ikon-sec').forEach(b => { b.classList.toggle('secili', b.dataset.ik === ikon); b.style.setProperty('--r', renk); });
  };
  boya();
  icerik.querySelector('.renkler').onclick = e => { const b = e.target.closest('.renk'); if (b) { renk = b.dataset.r; boya(); } };
  icerik.querySelector('.ikonlar').onclick = e => { const b = e.target.closest('.ikon-sec'); if (b) { ikon = b.dataset.ik; boya(); } };
  $('#dersKaydet').onclick = async e => {
    const ad = $('#dersAd').value.trim();
    if (!ad) { alert('Ders adını yaz.'); return; }
    const d = dersler();
    if (d[k].some((x, n) => x.ad === ad && n !== i)) { alert('Bu isimde bir ders zaten var.'); return; }
    e.target.disabled = true;
    if (mevcut) {
      const eskiAd = d[k][i].ad;
      Object.assign(d[k][i], { ad, ikon, renk });
      if (eskiAd !== ad) {
        for (const s of (await hepsi()).filter(s => sinavi(s) === k && s.ders === eskiAd)) { s.ders = ad; await kaydet(s); }
        tamamDersAdi(k, eskiAd, ad);
      }
    } else d[k].push({ ad, konular: [], ikon, renk });
    dersKaydet(d); geri();
  };
}

async function dersSil(k, i){
  const d = dersler(), ders = d[k][i];
  const sorular = (await hepsi()).filter(s => sinavi(s) === k && s.ders === ders.ad);
  const mesaj = sorular.length
    ? `${k} "${ders.ad}" dersi ve içindeki ${sorular.length} soru silinecek. Emin misin?`
    : `${k} "${ders.ad}" dersi silinsin mi?`;
  if (!confirm(mesaj)) return;
  for (const s of sorular) { await sil(s.id); onbellekSil(s.id); }
  d[k].splice(i, 1); dersKaydet(d); tamamDersSil(k, ders.ad);
  if (gecmis[gecmis.length - 1].fn === dersSayfasi) gecmis.pop();
  yenile();
}

function konuEkle(k, i){
  const ad = (prompt('Konu adı:') || '').trim();
  if (!ad) return;
  const d = dersler();
  if (d[k][i].konular.includes(ad)) { alert('Bu konu zaten var.'); return; }

async function konuAdlandir(k, i, j){
  const d = dersler(), ders = d[k][i], eski = ders.konular[j];
  const ad = (prompt('Konunun yeni adı:', eski) || '').trim();
  if (!ad || ad === eski) return;
  if (ders.konular.includes(ad)) { alert('Bu konu zaten var.'); return; }
  const tamamdi = tamamMi(k, ders.ad, eski);
  ders.konular[j] = ad; dersKaydet(d);
  if (tamamdi) { tamamDegis(k, ders.ad, eski, false); tamamDegis(k, ders.ad, ad, true); }
  for (const s of (await hepsi()).filter(s => sinavi(s) === k && s.ders === ders.ad && s.konu === eski)) { s.konu = ad; await kaydet(s); }
  yenile();
}

async function konuSil(k, i, j){
  const d = dersler(), ders = d[k][i], konu = ders.konular[j];
  const sorular = (await hepsi()).filter(s => sinavi(s) === k && s.ders === ders.ad && s.konu === konu);
  const mesaj = sorular.length ? `"${konu}" konusu ve içindeki ${sorular.length} soru silinecek. Emin misin?` : `"${konu}" konusu silinsin mi?`;
  if (!confirm(mesaj)) return;
  for (const s of sorular) { await sil(s.id); onbellekSil(s.id); }
  ders.konular.splice(j, 1); dersKaydet(d); tamamDegis(k, ders.ad, konu, false);
  if (gecmis[gecmis.length - 1].fn === konuSayfasi) gecmis.pop();
  yenile();
}

// ================= İstatistikler =================
async function istatistik(){
  const sorular = await hepsi(), d = dersler(), gl = gunluk();
  const toplamTekrar = sorular.reduce((a, s) => a + (s.tekrar || 0), 0);
  const ogrenilen = sorular.filter(s => (s.seviye || 0) >= 3).length;
  const sirada = sorular.filter(sirasiGeldi).length;
  const gunler = [...Array(7)].map((_, n) => {
    const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - (6 - n));
    const bas = t.getTime(), son = bas + 864e5;
    return { etiket: t.toLocaleDateString('tr-TR', { weekday: 'short' }), tekrar: (gl[gun(t)] || {}).t || 0,
             eklenen: sorular.filter(s => s.tarih >= bas && s.tarih < son).length, bugun: n === 6 };
  });
  const max = Math.max(1, ...gunler.map(g => Math.max(g.tekrar, g.eklenen)));
  let konuT = 0, konuN = 0; const dagilim = [];
  for (const k of ['TYT', 'AYT']) for (const x of d[k]) {
    konuN += x.konular.length; konuT += tamamSay(k, x);
    const c = sorular.filter(s => sinavi(s) === k && s.ders === x.ad).length;
    if (c) dagilim.push({ k, x, c });
  }
  dagilim.sort((a, b) => b.c - a.c);
  const enCok = dagilim.length ? dagilim[0].c : 1;
  ekran('İstatistikler', `
    <div class="stat-izgara">
      <div class="stat">${ui('soru')}<b>${sorular.length}</b><span>Toplam soru</span></div>
      <div class="stat" style="--r:var(--mor)">${ui('tekrar')}<b>${toplamTekrar}</b><span>Toplam tekrar</span></div>
      <div class="stat" style="--r:var(--yesil)">${ui('tik')}<b>${ogrenilen}</b><span>Öğrenilen (3+ kez bildin)</span></div>
      <div class="stat" style="--r:#fb923c">${ui('alev')}<b>${seri(sorular)}</b><span>Gün serisi</span></div>
    </div>
    <h2>Son 7 gün</h2>
    <div class="kart-kutu">
      <div class="grafik">${gunler.map(g => `<div class="gun ${g.bugun ? 'bugun' : ''}"><div class="cubuklar"><i class="c1" style="height:${g.tekrar / max * 100}%" title="${g.tekrar} tekrar"></i><i class="c2" style="height:${g.eklenen / max * 100}%" title="${g.eklenen} soru"></i></div><span>${g.etiket}</span></div>`).join('')}</div>
      <div class="lejant"><span><i class="c1"></i>Tekrar</span><span><i class="c2"></i>Eklenen soru</span></div>
    </div>
    <h2>Konu ilerlemesi</h2>
    <div class="kart-kutu">
      <div class="buyuk-sayi">${konuT}<small> / ${konuN} konu tamamlandı</small></div>
      <div class="mini-bar" style="height:6px;margin-top:12px"><i style="width:${konuN ? konuT / konuN * 100 : 0}%"></i></div>
    </div>
    <h2>Derslere göre sorular</h2>
    ${dagilim.length ? `<ul class="liste duz dagilim">${dagilim.map(({ k, x, c }) => `<li style="--r:${x.renk}">${rozet(x, 'kucuk')}<div class="bilgi"><div class="ad">${esc(x.ad)} <span style="color:var(--soluk);font-weight:500;font-size:13px">${k}</span></div><div class="mini-bar"><i style="width:${c / enCok * 100}%"></i></div></div><span class="sayi">${c}</span></li>`).join('')}</ul>`
      : '<p class="bos">Henüz soru yok.</p>'}
    <p class="ipucu sol">Günlük tekrar sayıları bu sürümden itibaren kaydediliyor.</p>`, '', true);
}

// Çift dokunuş: kartı çevir. Dokunmatikte iki dokunuş arası süreye bakılır; farede çift tıklama.
let sonCevirme = 0;
function kartCevir(kart){ if (!kart) return; kart.classList.toggle('cevrik'); sonCevirme = Date.now(); }
function ciftDokunmaKur(alan){
  if (!alan) return;
  let bas = null, sonDokunus = 0;
  alan.addEventListener('touchstart', e => { const p = e.touches[0]; bas = e.touches.length === 1 ? { x: p.clientX, y: p.clientY, t: Date.now() } : null; }, { passive: true });
  alan.addEventListener('touchmove', e => { if (bas) { const p = e.touches[0]; if (Math.hypot(p.clientX - bas.x, p.clientY - bas.y) > 10) bas = null; } }, { passive: true });
  alan.addEventListener('touchend', e => {
    if (!bas || Date.now() - bas.t > 300) { bas = null; return; }
    bas = null;
    const simdi = Date.now();
    if (simdi - sonDokunus < 320) { kartCevir(e.target.closest('.kart')); sonDokunus = 0; if (e.cancelable) e.preventDefault(); }
    else sonDokunus = simdi;
  });
  alan.addEventListener('dblclick', e => { if (Date.now() - sonCevirme < 600) return; kartCevir(e.target.closest('.kart')); });
}

// ================= Soru inceleme (sorular arası ileri / geri) =================
const listeler = { son: [], konu: [] };
function incele(liste, n){ git(soruInceleme, (listeler[liste] || []).slice(), n); }
function soruDetay(id){ return soruInceleme([id], 0); }

async function soruInceleme(ids, n){
  if (!ids.length) { geri(); return; }
  n = Math.max(0, Math.min(n, ids.length - 1));
  const g = gecmis[gecmis.length - 1]; if (g && g.fn === soruInceleme) g.args = [ids, n];
  const [onceki, s, sonraki] = await Promise.all([
    n > 0 ? getir(ids[n - 1]) : null, getir(ids[n]), n < ids.length - 1 ? getir(ids[n + 1]) : null
  ]);
  if (!s) { ids.splice(n, 1); return soruInceleme(ids, n); }
  const slayt = x => `<div class="slayt">${x ? kartHtml(x) : ''}</div>`;
  const ilk = n === 0, son = n === ids.length - 1;
  ekran(s.konu, `
    ${yol(sinavi(s), s.ders, s.konu)}
    <div class="sahne" id="sahne"><div class="ray" id="ray">${slayt(onceki)}${slayt(s)}${slayt(sonraki)}</div></div>
    <p class="ipucu">Çözüm için karta iki kez dokun${ids.length > 1 ? ' · Diğer sorular için sağa sola kaydır' : ''}</p>
    ${s.not ? `<p class="not">${esc(s.not)}</p>` : ''}
    <details class="cozum"><summary>Çözümü göster</summary>${cozumHtml(s)}</details>
    <p class="kucuk-yazi">${s.tekrar || 0} kez tekrar edildi</p>
    <button class="tehlike" onclick="incelemeSil()">Soruyu sil</button>`,
    ids.length > 1 ? `<div class="gezgin"><button id="oncekiBtn" class="${ilk ? 'pasif' : ''}" aria-disabled="${ilk}">‹ Önceki</button><span class="sayac">${n + 1} / ${ids.length}</span><button id="sonrakiBtn" class="${son ? 'pasif' : ''}" aria-disabled="${son}">Sonraki ›</button></div>` : '');
  incelemeKur(ids, n);
}

function incelemeKur(ids, n){
  const sahne = $('#sahne'), ray = $('#ray');
  let gecis = false;
  const genislik = () => sahne.clientWidth;
  const konum = (dx, anim) => {
    ray.style.transition = anim ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
    ray.style.transform = `translateX(calc(-100% + ${dx}px))`;
  };
  const gec = yon => {
    if (gecis) return;
    const h = n + yon;
    if (h < 0) { konum(0, true); bildir('Bu ilk soru, öncesi yok'); return; }
    if (h >= ids.length) { konum(0, true); bildir('Son soruya geldin'); return; }
    gecis = true;
    konum(yon > 0 ? -genislik() : genislik(), true);
    setTimeout(() => soruInceleme(ids, h), 280);
  };
  const ob = $('#oncekiBtn'), sb = $('#sonrakiBtn');
  if (ob) ob.onclick = () => gec(-1);
  if (sb) sb.onclick = () => gec(1);

  // Kaydırma ve çift dokunuş
  let t = null, sonDokunus = 0;
  sahne.addEventListener('touchstart', e => {
    t = null;
    if (e.touches.length !== 1 || gecis) return;
    const p = e.touches[0];
    if (p.clientX <= 24) return;            // sol kenar: sayfadan çıkış hareketine bırak
    t = { x: p.clientX, y: p.clientY, z: Date.now(), yatay: false, iptal: false, dx: 0, v: 0, lx: p.clientX, lz: Date.now() };
  }, { passive: true });
  sahne.addEventListener('touchmove', e => {
    if (!t || t.iptal) return;
    const p = e.touches[0], dx = p.clientX - t.x, dy = p.clientY - t.y;
    if (!t.yatay) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { t.iptal = true; return; }
      if (Math.abs(dx) > 10) t.yatay = true; else return;
    }
    if (e.cancelable) e.preventDefault();
    const simdi = Date.now();
    t.v = (p.clientX - t.lx) / Math.max(1, simdi - t.lz); t.lx = p.clientX; t.lz = simdi; t.dx = dx;
    const uc = (n === 0 && dx > 0) || (n === ids.length - 1 && dx < 0);
    konum(uc ? dx * 0.3 : dx, false);         // uçlarda lastik gibi direnç
  }, { passive: false });
  sahne.addEventListener('touchend', e => {
    if (!t) return;
    const o = t; t = null;
    if (o.yatay) {
      const W = genislik();
      if (o.dx < -W * .25 || (o.dx < -40 && o.v < -.4)) gec(1);
      else if (o.dx > W * .25 || (o.dx > 40 && o.v > .4)) gec(-1);
      else konum(0, true);
      return;
    }
    if (o.iptal || Date.now() - o.z > 300) return;
    const simdi = Date.now();
    if (simdi - sonDokunus < 320) { kartCevir(e.target.closest('.kart')); sonDokunus = 0; if (e.cancelable) e.preventDefault(); }
    else sonDokunus = simdi;
  });
  sahne.addEventListener('touchcancel', () => { if (t && t.yatay) konum(0, true); t = null; });
  sahne.addEventListener('dblclick', e => { if (Date.now() - sonCevirme < 600) return; kartCevir(e.target.closest('.kart')); });
}

async function incelemeSil(){
  const g = gecmis[gecmis.length - 1], [ids, n] = g.args;
  if (!confirm('Bu soru silinsin mi?')) return;
  await sil(ids[n]); onbellekSil(ids[n]);
  ids.splice(n, 1);
  if (!ids.length) { geri(); return; }
  soruInceleme(ids, Math.min(n, ids.length - 1));
}

let oturum = null;
async function tekrarBaslat(k, i, j){

    liste = liste.filter(s => sinavi(s) === k);
    if (i !== undefined) liste = liste.filter(s => s.ders === d[k][i].ad);

  }

}

async function tekrarEkrani(){
  if (!oturum) { geri(); return; }

  if (oturum.n >= toplam) {

  ekran(`Tekrar · ${oturum.n + 1} / ${toplam}`, `
    <div class="ilerleme"><div style="width:${oturum.n / toplam * 100}%"></div></div>

    `<div class="iki"><button class="kirmizi" onclick="cevap(false)">Bilemedim</button><button class="yesil" onclick="cevap(true)">Bildim</button></div>`);
  ciftDokunmaKur($('#tekKart'));
}

async function cevap(bildi){
  const s = await getir(oturum.ids[oturum.n]);
  if (s) {
    s.tekrar = (s.tekrar || 0) + 1;
    if (bildi) {
      s.seviye = Math.min((s.seviye || 0) + 1, ARALIK.length);
      s.sonraki = Date.now() + ARALIK[s.seviye - 1] * 864e5;
      oturum.bildi++;
    } else {
      s.seviye = 0;
      s.sonraki = Date.now(); // bilemediğin soru hemen tekrar sıraya girer
    }

  }
  oturum.n++; temizle(); tekrarEkrani();
}

function tekrarBitir(){ oturum = null; geri(); }

// ================= Veri Durumu ve Yedekleme (SALT OKUNUR) =================
// Bu bölümdeki hiçbir fonksiyon veri yazmaz:
//  - IndexedDB: yalnızca 'readonly' işlem (count, getAll, get); sürüm yükseltme yok, yeni bağlantı açılmaz
//  - localStorage: yalnızca okuma (key, getItem)
// Geri yükleme bu sürümde YOKTUR.
var UYGULAMA_SURUMU = '1.6';
const JSON_ANAHTARLAR = ['sd_dersler_v2', 'sd_tamam', 'sd_gunluk', 'sd_dersler'];
const BILINEN_ANAHTAR = {
  sd_dersler_v2: 'Ders ve konu listesi', sd_tamam: 'Tamamlanan konular', sd_gunluk: 'Günlük tekrar sayıları',
  sd_son_sinav: 'Dersler sekmesinde son seçilen sınav', sd_dersler: 'İlk sürümden kalan eski liste (artık okunmuyor)'
};

function lsOku(){ const o = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); o[k] = localStorage.getItem(k); } return o; }
function salt(fn){
  return new Promise((ok, hata) => {
    const t = db.transaction('sorular', 'readonly');
    const r = fn(t.objectStore('sorular'));
    t.oncomplete = () => ok(r.result); t.onerror = () => hata(t.error); t.onabort = () => hata(t.error);
  });
}
const bayt = s => new TextEncoder().encode(s).length;
const boyutYaz = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
async function sha256(veri){ const h = await crypto.subtle.digest('SHA-256', veri); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

// Bir kaydın görsel alanını oku (iPhone'da ilk denemede açılamazsa kaydı salt okunur yeniden alıp 2 kez daha dener)
async function blobOku(id, alan, blob){
  for (let d = 0; d < 3; d++) {
    try {
      if (!blob || d > 0) { const s = await salt(st => st.get(id)); blob = s && s[alan]; if (!(blob instanceof Blob)) throw new Error('kayıtta görsel yok'); }
      const buf = await blob.arrayBuffer();
      if (!buf.byteLength) throw new Error('boş dosya');
      return { buf, tip: blob.type || '' };
    } catch (e) { if (d === 2) throw e; await bekle(150 * (d + 1)); }
  }
}
async function gorselCozulur(buf, tip){
  const blob = new Blob([buf], { type: tip || 'image/jpeg' });
  try { if (window.createImageBitmap) { const b = await createImageBitmap(blob); const r = { w: b.width, h: b.height }; if (b.close) b.close(); return r; } } catch {}
  return await new Promise(ok => {
    const u = URL.createObjectURL(blob), i = new Image();
    i.onload = () => { ok(i.naturalWidth ? { w: i.naturalWidth, h: i.naturalHeight } : null); URL.revokeObjectURL(u); };
    i.onerror = () => { ok(null); URL.revokeObjectURL(u); };
    i.src = u;
  });
}
const gorselAlanlari = s => Object.keys(s).filter(a => s[a] instanceof Blob);
const yerYaz = s => `${s.sinav || 'TYT'} › ${s.ders} › ${s.konu}`;

// ---- 1-5: Envanter ----
async function envanterCikar(ilerle){
  const ls = lsOku();
  const kayitSayisi = await salt(st => st.count());
  const kayitlar = await salt(st => st.getAll());
  const sorunlar = [];
  const ekle = (tur, m, d) => sorunlar.push({ tur, m, d });

  // localStorage anahtarları
  const anahtarlar = Object.keys(ls).sort().map(k => {
    const v = ls[k]; let gecerli = true;
    if (JSON_ANAHTARLAR.includes(k)) { try { JSON.parse(v); } catch { gecerli = false; } }
    return { k, bayt: bayt(v), gecerli, aciklama: BILINEN_ANAHTAR[k] || (k.startsWith('sd_') ? 'Tanınmayan sd_ anahtarı' : 'Bu uygulamaya ait değil (aynı adresteki başka bir sayfaya ait olabilir)') };
  });
  anahtarlar.filter(a => !a.gecerli).forEach(a => ekle('hata', `${a.k} okunamıyor (bozuk JSON)`));
  const tumAnahtar = [...new Set([...Object.keys(ACILIS_LS), ...Object.keys(ls)])];
  const oturumdaDegisen = tumAnahtar.filter(k => ACILIS_LS[k] !== ls[k]);

  // Ders listesi
  let dl = null; try { dl = JSON.parse(ls.sd_dersler_v2); } catch {}
  const dlGecerli = dl && Array.isArray(dl.TYT) && Array.isArray(dl.AYT);
  if (!dlGecerli) ekle('hata', 'Ders listesi (sd_dersler_v2) okunamadı ya da beklenen yapıda değil');
  const dersBul = (k, ad) => dlGecerli && Array.isArray(dl[k]) ? dl[k].find(x => x && x.ad === ad) : null;
  if (dlGecerli) for (const k of ['TYT', 'AYT']) {
    const adlar = dl[k].map(x => x && x.ad);
    adlar.filter((a, i) => adlar.indexOf(a) !== i).forEach(a => ekle('uyari', `${k}: "${a}" dersi listede birden fazla kez geçiyor`));
    dl[k].forEach(x => { const ks = (x && x.konular) || []; ks.filter((a, i) => ks.indexOf(a) !== i).forEach(a => ekle('uyari', `${k} › ${x.ad}: "${a}" konusu birden fazla kez geçiyor`)); });
  }

  // Sorular ve bağlantıları
  let sinavsiz = 0; const kimlikler = new Set();
  for (const s of kayitlar) {
    if (typeof s.id !== 'string' || !s.id) ekle('hata', 'Kimliği geçersiz bir kayıt var');
    else if (kimlikler.has(s.id)) ekle('hata', `Aynı kimlik iki kez: ${s.id}`); else kimlikler.add(s.id);
    if (!s.sinav) sinavsiz++;
    else if (!['TYT', 'AYT'].includes(s.sinav)) ekle('uyari', `Tanınmayan sınav değeri "${s.sinav}"`, s.id);
    if (!s.ders || !s.konu) { ekle('hata', 'Dersi ya da konusu boş soru', s.id); continue; }
    const d = dersBul(s.sinav || 'TYT', s.ders);
    if (dlGecerli && !d) ekle('uyari', `Soru listede olmayan bir derse bağlı: ${yerYaz(s)}`, s.id);
    else if (d && !(d.konular || []).includes(s.konu)) ekle('uyari', `Soru listede olmayan bir konuya bağlı: ${yerYaz(s)}`, s.id);
    if (!(s.soruImg instanceof Blob)) ekle('hata', `Soru görseli kayıtta yok: ${yerYaz(s)}`, s.id);
    for (const a of ['tarih', 'tekrar', 'seviye', 'sonraki']) if (s[a] !== undefined && s[a] !== null && typeof s[a] !== 'number') ekle('uyari', `"${a}" alanı sayı değil`, s.id);
  }
  if (sinavsiz) ekle('bilgi', `${sinavsiz} soru ilk sürümden kalma ("sınav" alanı yok); uygulama bunları TYT sayıyor`);

  // Tamamlanan konular
  if (ls.sd_tamam !== undefined) {
    let tm = null; try { tm = JSON.parse(ls.sd_tamam); } catch {}
    if (tm && dlGecerli) for (const key of Object.keys(tm)) {
      const [k, ...r] = key.split('|'), ad = r.join('|'), d = dersBul(k, ad);
      for (const konu of (Array.isArray(tm[key]) ? tm[key] : [])) if (!d || !(d.konular || []).includes(konu)) ekle('bilgi', `Tamamlandı kaydı artık listede olmayan konuyu gösteriyor: ${k} › ${ad} › ${konu}`);
    }
  }
  // İlk sürümden kalan liste
  if (ls.sd_dersler !== undefined) {
    let eski = null; try { eski = JSON.parse(ls.sd_dersler); } catch {}
    if (Array.isArray(eski) && dlGecerli) {
      for (const x of eski) {
        if (!x || !x.ad) continue;
        const d = dersBul('TYT', x.ad) || dersBul('AYT', x.ad);
        if (!d) ekle('bilgi', `Eski listede olup yeni listede olmayan ders: "${x.ad}"${(x.konular || []).length ? ` (${x.konular.length} konu)` : ''}`);
        else (x.konular || []).filter(kn => !(d.konular || []).includes(kn)).forEach(kn => ekle('bilgi', `Eski listede olup yeni listede olmayan konu: ${x.ad} › ${kn}`));
      }
    }
  }

  // Görseller: her biri okunur ve çözülmeye çalışılır
  const gorseller = [];
  const toplam = kayitlar.reduce((a, s) => a + gorselAlanlari(s).length, 0); let n = 0;
  for (const s of kayitlar) for (const alan of gorselAlanlari(s)) {
    const g = { id: s.id, alan, yer: yerYaz(s), ok: false };
    try {
      const { buf, tip } = await blobOku(s.id, alan, s[alan]);
      g.boyut = buf.byteLength; g.tip = tip;
      const olcu = await gorselCozulur(buf, tip);
      if (olcu) { g.ok = true; g.w = olcu.w; g.h = olcu.h; } else g.hata = 'Dosya var ama görsel olarak açılamıyor';
    } catch (e) { g.hata = 'Dosya okunamadı: ' + (e && e.message || e); }
    gorseller.push(g);
    if (ilerle) ilerle(++n, toplam);
  }
  return {
    zaman: new Date().toISOString(), db: { ad: db.name, surum: db.version, tablolar: [...db.objectStoreNames] },
    kayitSayisi, kayitSayisiListe: kayitlar.length, anahtarlar, oturumdaDegisen, sorunlar, gorseller,
    soruGorsel: kayitlar.filter(s => s.soruImg instanceof Blob).length,
    cozumGorsel: kayitlar.filter(s => s.cozumImg instanceof Blob).length
  };
}

// ---- 6: .sdyedek dosyası (sıkıştırmasız ZIP) ----
function zipOlustur(dosyalar){
  const enc = new TextEncoder(), parcalar = [], merkez = []; let ofset = 0;
  const t = new Date();
  const dz = ((t.getHours() << 11) | (t.getMinutes() << 5) | (t.getSeconds() >> 1)) & 0xFFFF;
  const dt = (((t.getFullYear() - 1980) << 9) | ((t.getMonth() + 1) << 5) | t.getDate()) & 0xFFFF;
  for (const f of dosyalar) {
    const ad = enc.encode(f.ad), crc = crc32(f.veri), boy = f.veri.length;
    const y = new DataView(new ArrayBuffer(30));
    y.setUint32(0, 0x04034b50, true); y.setUint16(4, 20, true); y.setUint16(6, 0x0800, true); y.setUint16(8, 0, true);
    y.setUint16(10, dz, true); y.setUint16(12, dt, true); y.setUint32(14, crc, true); y.setUint32(18, boy, true);
    y.setUint32(22, boy, true); y.setUint16(26, ad.length, true); y.setUint16(28, 0, true);
    parcalar.push(new Uint8Array(y.buffer), ad, f.veri);
    const m = new DataView(new ArrayBuffer(46));
    m.setUint32(0, 0x02014b50, true); m.setUint16(4, 20, true); m.setUint16(6, 20, true); m.setUint16(8, 0x0800, true);
    m.setUint16(10, 0, true); m.setUint16(12, dz, true); m.setUint16(14, dt, true); m.setUint32(16, crc, true);
    m.setUint32(20, boy, true); m.setUint32(24, boy, true); m.setUint16(28, ad.length, true);
    m.setUint16(30, 0, true); m.setUint16(32, 0, true); m.setUint16(34, 0, true); m.setUint16(36, 0, true);
    m.setUint32(38, 0, true); m.setUint32(42, ofset, true);
    merkez.push(new Uint8Array(m.buffer), ad);
    ofset += 30 + ad.length + boy;
  }
  const mBoy = merkez.reduce((a, p) => a + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
  e.setUint16(8, dosyalar.length, true); e.setUint16(10, dosyalar.length, true);
  e.setUint32(12, mBoy, true); e.setUint32(16, ofset, true); e.setUint16(20, 0, true);
  return new Blob([...parcalar, ...merkez, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
// Doğrulama için bağımsız ZIP okuyucu: dosyayı baştan okur
function zipOku(buf){
  const v = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  const e = buf.byteLength - 22;
  if (e < 0 || v.getUint32(e, true) !== 0x06054b50) throw new Error('ZIP sonu bulunamadı');
  const adet = v.getUint16(e + 10, true); let p = v.getUint32(e + 16, true); const sonuc = [];
  for (let i = 0; i < adet; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('Merkez dizin bozuk');
    const crc = v.getUint32(p + 16, true), boy = v.getUint32(p + 20, true), adU = v.getUint16(p + 28, true);
    const exU = v.getUint16(p + 30, true), yoU = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const ad = dec.decode(u8.subarray(p + 46, p + 46 + adU));
    if (v.getUint32(lo, true) !== 0x04034b50) throw new Error('Yerel başlık bozuk: ' + ad);
    const bas = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
    sonuc.push({ ad, crc, veri: u8.subarray(bas, bas + boy) });
    p += 46 + adU + exU + yoU;
  }
  return sonuc;
}
// Kaydı JSON'a çevir: görsel alanları dosya referansı olur, diğer bütün alanlar (bilinmeyenler dahil) aynen kalır
function kayitJson(s, referanslar){
  const o = {};
  for (const [a, v] of Object.entries(s)) {
    if (v instanceof Blob) o[a] = { __dosya: referanslar[a] };
    else if (v instanceof Date) o[a] = { __tarih: v.toISOString() };
    else o[a] = v;
  }
  return o;
}
const guvenli = s => String(s).replace(/[^A-Za-z0-9_-]/g, '_');
const iki = n => String(n).padStart(2, '0');

async function yedekOlustur(ilerle){
  const ls = lsOku();
  const sayi = await salt(st => st.count());
  const kayitlar = await salt(st => st.getAll());
  const enc = new TextEncoder(), dosyalar = [], gorselListe = [], kullanilan = new Set();
  const toplam = kayitlar.reduce((a, s) => a + gorselAlanlari(s).length, 0); let n = 0;
  const sorular = [];
  for (const s of kayitlar) {
    const ref = {};
    for (const alan of gorselAlanlari(s)) {
      const { buf, tip } = await blobOku(s.id, alan, s[alan]);
      const u = new Uint8Array(buf);
      const uz = /png/.test(tip) ? 'png' : /jpe?g/.test(tip) || !tip ? 'jpg' : 'bin';
      let yol = `gorseller/${guvenli(s.id)}_${alan === 'soruImg' ? 'soru' : alan === 'cozumImg' ? 'cozum' : guvenli(alan)}.${uz}`;
      for (let k = 2; kullanilan.has(yol); k++) yol = yol.replace(/(\.\w+)$/, `_${k}$1`);
      kullanilan.add(yol);
      const h = await sha256(u);
      ref[alan] = yol;
      gorselListe.push({ dosya: yol, soruId: s.id, alan, tip, boyut: u.length, sha256: h });
      dosyalar.push({ ad: yol, veri: u });
      if (ilerle) ilerle(++n, toplam);
    }
    sorular.push(kayitJson(s, ref));
  }
  const acilisFarkli = Object.keys({ ...ACILIS_LS, ...ls }).some(k => ACILIS_LS[k] !== ls[k]);
  const manifest = {
    bicim: 'sdyedek', bicimSurumu: 1, uygulama: 'Soru Defteri', uygulamaSurumu: UYGULAMA_SURUMU,
    olusturma: new Date().toISOString(),
    kaynak: { adres: location.origin + location.pathname, tarayici: navigator.userAgent },
    indexedDB: { ad: db.name, surum: db.version, tablolar: [{ ad: 'sorular', anahtarAlani: 'id', kayitSayisi: sayi }] },
    localStorage: ls,                                   // değerler birebir metin olarak
    localStorageAcilis: acilisFarkli ? ACILIS_LS : null, // açılıştaki onarımdan önceki hâl (farklıysa)
    sorular, gorseller: gorselListe,
    ozet: { soru: sayi, soruGorseli: kayitlar.filter(s => s.soruImg instanceof Blob).length,
            cozumGorseli: kayitlar.filter(s => s.cozumImg instanceof Blob).length,
            gorselDosyasi: gorselListe.length, localStorageAnahtari: Object.keys(ls).length }
  };
  const beniOku = `Soru Defteri güvenlik kopyası\n\nOluşturma: ${manifest.olusturma}\nUygulama sürümü: ${UYGULAMA_SURUMU}\n\n` +
    `manifest.json : bütün kayıtlar, ders/konu listesi, ayarlar ve görsellerin SHA-256 parmak izleri\n` +
    `gorseller/     : soru ve çözüm görselleri (JPEG)\n\nSoru: ${manifest.ozet.soru} · Soru görseli: ${manifest.ozet.soruGorseli} · Çözüm görseli: ${manifest.ozet.cozumGorseli}\n` +
    `Bu dosya bir ZIP arşividir; uzantısı .zip yapılırsa bilgisayarda açılabilir.\n`;
  const manifestBayt = enc.encode(JSON.stringify(manifest, null, 1));
  dosyalar.unshift({ ad: 'manifest.json', veri: manifestBayt }, { ad: 'BENIOKU.txt', veri: enc.encode(beniOku) });
  const zip = zipOlustur(dosyalar);
  const t = new Date();
  const ad = `SoruDefteri-yedek-${t.getFullYear()}-${iki(t.getMonth() + 1)}-${iki(t.getDate())}-${iki(t.getHours())}${iki(t.getMinutes())}.sdyedek`;
  const dosya = new File([zip], ad, { type: 'application/zip' });
  return { dosya, manifest, manifestSha: await sha256(manifestBayt), dosyaSayisi: dosyalar.length };
}

// ---- 7: Doğrulama (dosya baştan okunur, veritabanı ve localStorage ile karşılaştırılır) ----
async function yedekDogrula(y){
  const k = [];
  const kontrol = (ad, ok, detay = '') => k.push({ ad, ok, detay });
  const buf = await y.dosya.arrayBuffer();
  const dosyaSha = await sha256(buf);
  let girdiler = [];
  try { girdiler = zipOku(buf); kontrol('Arşiv yapısı okunabiliyor', girdiler.length === y.dosyaSayisi, `${girdiler.length} dosya`); }
  catch (e) { kontrol('Arşiv yapısı okunabiliyor', false, e.message); return { k, dosyaSha, boyut: buf.byteLength }; }
  const crcHata = girdiler.filter(g => crc32(g.veri) !== g.crc);
  kontrol('Her dosyanın CRC32 sağlaması tutuyor', !crcHata.length, crcHata.map(g => g.ad).join(', '));
  const harita = new Map(girdiler.map(g => [g.ad, g]));
  let m = null;
  try { m = JSON.parse(new TextDecoder().decode(harita.get('manifest.json').veri)); } catch {}
  kontrol('manifest.json okunabiliyor', !!m);
  if (!m) return { k, dosyaSha, boyut: buf.byteLength };
  kontrol('manifest.json SHA-256 tutuyor', (await sha256(harita.get('manifest.json').veri)) === y.manifestSha);

  // Görseller: arşivdeki her dosyanın SHA-256'sı manifest ve veritabanındaki asılla aynı mı
  let gOk = 0; const gHata = [];
  const kayitlar = await salt(st => st.getAll());
  const kMap = new Map(kayitlar.map(s => [s.id, s]));
  for (const g of m.gorseller) {
    const f = harita.get(g.dosya);
    if (!f) { gHata.push(g.dosya + ' arşivde yok'); continue; }
    const hArsiv = await sha256(f.veri);
    let hAsil = null;
    try { const { buf: b } = await blobOku(g.soruId, g.alan, kMap.get(g.soruId) && kMap.get(g.soruId)[g.alan]); hAsil = await sha256(b); } catch {}
    if (hArsiv === g.sha256 && hAsil === g.sha256) gOk++; else gHata.push(g.dosya);
  }
  kontrol(`Görseller SHA-256 ile doğrulandı (${gOk} / ${m.gorseller.length})`, !gHata.length, gHata.join(', '));

  // Kayıtlar: sayı ve içerik
  const sayi = await salt(st => st.count());
  kontrol(`Soru sayısı tutuyor (${m.sorular.length} / ${sayi})`, m.sorular.length === sayi && m.indexedDB.tablolar[0].kayitSayisi === sayi);
  const refMap = {}; m.gorseller.forEach(g => { (refMap[g.soruId] = refMap[g.soruId] || {})[g.alan] = g.dosya; });
  const yedekMap = new Map(m.sorular.map(s => [s.id, JSON.stringify(s)]));
  const kayitFark = kayitlar.filter(s => yedekMap.get(s.id) !== JSON.stringify(kayitJson(s, refMap[s.id] || {})));
  kontrol('Her sorunun bütün alanları yedekte aynen var', !kayitFark.length, kayitFark.map(s => s.id).join(', '));
  const eksikGorsel = kayitlar.reduce((a, s) => a + gorselAlanlari(s).filter(al => !(refMap[s.id] || {})[al]).length, 0);
  kontrol('Hiçbir görsel dışarıda kalmadı', !eksikGorsel, eksikGorsel ? eksikGorsel + ' görsel eksik' : '');

  // localStorage: bütün anahtarlar birebir
  const ls = lsOku(), anahtar = [...new Set([...Object.keys(ls), ...Object.keys(m.localStorage)])];
  const lsFark = anahtar.filter(a => ls[a] !== m.localStorage[a]);
  kontrol(`localStorage birebir yedeklendi (${Object.keys(m.localStorage).length} anahtar)`, !lsFark.length, lsFark.join(', '));
  return { k, dosyaSha, boyut: buf.byteLength };
}

// ---- 8: Dosyalar'a kaydet ----
let sonYedek = null;
async function yedekPaylas(){
  if (!sonYedek) return;
  const f = sonYedek.dosya;
  const adaylar = [f, new File([f], f.name + '.zip', { type: 'application/zip' })];
  for (const x of adaylar) {
    try {
      if (navigator.canShare && navigator.canShare({ files: [x] })) { await navigator.share({ files: [x], title: x.name }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  yedekIndir();
}
function yedekIndir(){
  if (!sonYedek) return;
  const u = URL.createObjectURL(sonYedek.dosya), a = document.createElement('a');
  a.href = u; a.download = sonYedek.dosya.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

    </div>

    <h2>IndexedDB</h2>

      ${e.db.tablolar.map(t => `<div class="grup-satir"><span>Tablo <code>${esc(t)}</code></span><b>${t === 'sorular' ? e.kayitSayisi + ' kayıt' : '–'}</b></div>`).join('')}
    </div>

    <h2>LocalStorage · ${e.anahtarlar.length} anahtar</h2>

      : '<div class="grup-satir"><p>Hiç anahtar yok.</p></div>'}</div>

    <h2>Açılıştaki onarım adımı</h2>
    <div class="kart-kutu"><ul class="kontroller">${e.oturumdaDegisen.length
      ? `<li><span class="isaret bilgi-i">i</span><div>Bu açılıştan beri değişen anahtarlar: ${e.oturumdaDegisen.map(k => `<code>${esc(k)}</code>`).join(', ')}<small>${e.oturumdaDegisen.every(k => k === 'sd_son_sinav') ? 'Yalnızca Dersler sekmesinde seçilen sınav değişti; bu normal kullanımdır.' : 'Yedek dosyası, açılıştan önceki hâli de ayrıca içerir.'}</small></div></li>`
      : '<li><span class="isaret ok-i">✓</span><div>Bu açılışta hiçbir kayıt değiştirilmedi.</div></li>'}</ul></div>

    <h2>Ders ve konu bağlantıları</h2>
    <div class="kart-kutu"><ul class="kontroller">${sorunlar.length
      ? sorunlar.map(s => `<li><span class="isaret ${s.tur}-i">${isaret(s.tur)}</span><div>${esc(s.m)}${s.d ? `<small>Soru kimliği: ${esc(s.d)}</small>` : ''}</div></li>`).join('')
      : '<li><span class="isaret ok-i">✓</span><div>Tutarsızlık bulunamadı.</div></li>'}</ul></div>

    <h2>Görsel kontrolü</h2>
    <div class="kart-kutu"><ul class="kontroller">
      <li><span class="isaret ${acilmayan.length ? 'hata-i' : 'ok-i'}">${acilmayan.length ? '✕' : '✓'}</span><div>${e.gorseller.length - acilmayan.length} / ${e.gorseller.length} görsel açılabiliyor<small>Toplam boyut: ${boyutYaz(e.gorseller.reduce((a, g) => a + (g.boyut || 0), 0))}</small></div></li>
      ${acilmayan.map(g => `<li><span class="isaret hata-i">✕</span><div>${g.alan === 'cozumImg' ? 'Çözüm' : 'Soru'} görseli · ${esc(g.yer)}<small>${esc(g.hata)} · ${esc(g.id)}</small></div></li>`).join('')}
    </ul></div>
    <div id="vdYedek"></div>`;
}
